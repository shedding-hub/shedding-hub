title: Development of real-time PCR assays for detection and quantification of human
  bocavirus
doi: 10.1016/j.jcv.2008.02.010
description: Study developing and clinically evaluating TaqMan real-time PCR assays
  targeting human bocavirus (HBoV) NS1, NP-1, and VP1 genes. Clinical evaluation tested
  506 nasopharyngeal (nasal) aspirates collected in Korea from Dec 2006 to May 2007
  from patients with acute respiratory tract infections; 11 patients were positive
  by all three assays and had quantified viral loads reported as copies per mL of
  specimen.
analytes:
  nasopharyngeal_aspirate_bocavirus_viral_load:
    description: 'Quantification of human bocavirus (HBoV) in nasal aspirate specimens
      by TaqMan MGB probe real-time PCR (ABI Prism 7900HT). Three assays targeting
      NS1, NP-1, and VP1 were run; viral load in clinical positives reported as mean
      copies/mL across the three primer–probe sets from three replicate tests. DNA
      extracted from 200 µL specimen using MagNa Pure LC total nucleic acid extraction
      kit. Real-time PCR reaction: 20 µL with 2 µL extracted DNA, TaqMan Universal
      PCR Master Mix, 900 nM primers, 250 nM probe; cycling 50°C 2 min (UNG), 95°C
      10 min, 40 cycles 95°C 15 s and 60°C 1 min.'
    specimen: nasopharyngeal_aspirate
    biomarker: bocavirus
    gene_target: NS1; NP-1; VP1
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: confirmation date
