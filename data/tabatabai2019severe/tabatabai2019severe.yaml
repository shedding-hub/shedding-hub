title: Severe Human Bocavirus 1 Respiratory Tract Infection in an Immunodeficient
  Child With Fatal Outcome
doi: 10.1097/INF.0000000000002354
description: Case report of a fatal lower respiratory tract infection attributed to
  acute primary human bocavirus 1 (HBoV1) infection in an immunodeficient 6-month-old
  boy. Serial quantitative PCR measurements of HBoV1 DNA were reported from serum
  and tracheal secretions over time.
