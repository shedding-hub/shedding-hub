title: Temporal dynamics of RSV shedding and genetic diversity in adults during the
  COVID-19 pandemic in a French hospital, early 2021
doi: 10.1016/j.virusres.2022.198950
description: Hospital-based observational study in adults admitted to Foch hospital
  (Suresnes, France) between Jan 1 and Mar 31, 2021. Systematic nasopharyngeal swab
  testing using the Alinity M RESP-4-Plex RT-PCR assay identified 8 RSV-positive adults
  (patients A–H). This extraction captures RSV RT-PCR cycle threshold (Ct) values
  over time from a figure-derived CSV; symptomatic participants are timed from symptom
  onset, and asymptomatic participants are timed from first positive PCR (confirmation
  date).
analytes:
  nasopharyngeal_swab_RSV_ct_symptomatic:
    description: RSV RNA detection in nasopharyngeal swabs (NPS) using Alinity M RESP-4-Plex
      (Abbott Molecular) RT-PCR. RSV positive defined per manufacturer; Ct value ≤40
      considered positive and Ct >40 considered negative. Time for symptomatic participants
      is days after symptom onset (as used for duration of positive PCR in symptomatic
      individuals).
    specimen: nasopharyngeal_swab
    biomarker: RSV
    limit_of_detection: 40
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
  nasopharyngeal_swab_RSV_ct_asymptomatic:
    description: RSV RNA detection in nasopharyngeal swabs (NPS) using Alinity M RESP-4-Plex
      (Abbott Molecular) RT-PCR. RSV positive defined per manufacturer; Ct value ≤40
      considered positive and Ct >40 considered negative. For asymptomatic individuals,
      timing is days after first positive PCR (confirmation date).
    specimen: nasopharyngeal_swab
    biomarker: RSV
    limit_of_detection: 40
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: confirmation date
