title: Alternative sampling specimens for the molecular detection of mpox (formerly
  monkeypox) virus
doi: 10.1016/j.jcv.2022.105372
description: Study of 25 patients with MPXV-confirmed skin lesions presenting for
  initial diagnostic workup at the Institute of Tropical Medicine sexual health clinic
  (Antwerp, Belgium). EDTA plasma, oropharyngeal swab, and saliva were collected at
  the same visit and tested by MPXV real-time PCR (generic primers/probe) to compare
  Ct values and diagnostic sensitivity across specimen types.
analytes:
  plasma:
    description: Mpox virus (MPXV) DNA detection by real-time PCR on EDTA plasma.
      DNA extracted manually (QIAamp DNA Mini kit; 200 µL input, 100 µL elution) or
      automatically (Maxwell; 300 µL input, 75 µL elution) with extraction method
      kept identical within compared pairs; PCR with PerfeCTa FastMix II and MPXV
      generic primers/probe; QuantStudio 5 instrument. Reported outcome is Ct value.
    specimen: plasma
    biomarker: mpox
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: confirmation date
  oropharyngeal_swab:
    description: Mpox virus (MPXV) DNA detection by real-time PCR on oropharyngeal
      (throat) swab collected using Copan ESwab containing 1 mL Liquid Amies medium.
      DNA extracted manually (QIAamp DNA Mini kit; 200 µL input, 100 µL elution) or
      automatically (Maxwell; 300 µL input, 75 µL elution) with extraction method
      kept identical within compared pairs; PCR with PerfeCTa FastMix II and MPXV
      generic primers/probe; QuantStudio 5 instrument. Reported outcome is Ct value.
    specimen: oropharyngeal_swab
    biomarker: mpox
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: confirmation date
  saliva:
    description: Mpox virus (MPXV) DNA detection by real-time PCR on saliva (>=1 mL)
      self-collected into an OMNIgene·ORAL collection tube containing a proprietary
      viral DNA stabilizing solution. DNA extracted manually (QIAamp DNA Mini kit;
      200 µL input, 100 µL elution) or automatically (Maxwell; 300 µL input, 75 µL
      elution) with extraction method kept identical within compared pairs; PCR with
      PerfeCTa FastMix II and MPXV generic primers/probe; QuantStudio 5 instrument.
      Reported outcome is Ct value.
    specimen: saliva
    biomarker: mpox
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: confirmation date
