title: Faecal shedding of rotavirus vaccine in Chinese children after vaccination
  with Lanzhou lamb rotavirus vaccine
doi: 10.1038/s41598-018-19469-w
description: Prospective post-marketing study of faecal shedding after oral Lanzhou
  lamb rotavirus vaccine (LLR) in children in China (September–November 2011/2012).
  114 children provided 1,184 stool samples collected for 15 days post-vaccination.
  Shedding was assessed by enzyme immunoassay (EIA, Oxoid Prospect ELISA kit, EIA
  positive threshold OD=0.21) and by real-time RT-PCR targeting the NSP3 gene (quantified
  by plasmid standard curve). Viral loads in PCR-positive samples ranged from <1.0×10^3
  to 1.9×10^8 copies/g stool. Reference time for all measurements is days post-vaccination.
analytes:
  stool_lanzhou_lamb_rotavirus_vaccine_EIA:
    description: Enzyme immunoassay (Oxoid Prospect ELISA Kit) detection of rotavirus
      antigen in stool. Positive threshold defined as OD >= 0.21 (positive control
      OD 2.5, negative control OD 0.1). Results reported qualitatively/semiquantitatively
      in table (e.g., + (weak positive), ++ (positive), +++ (strongpositive), ++++ (strong positive), N).
    specimen: stool
    biomarker: Lanzhou lamb rotavirus vaccine
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: gc/wet gram
    reference_event: vaccination
  stool_lanzhou_lamb_rotavirus_vaccine_pcr:
    description: Real-time RT-PCR quantification of rotavirus (vaccine strain) in
      stool targeting the NSP3 gene. Quantified using serial dilutions of plasmid-derived
      NSP3 RNA standards and reported as copies per gram of stool.
    specimen: stool
    biomarker: Lanzhou lamb rotavirus vaccine
    gene_target: NSP3
    limit_of_detection: 1000
    limit_of_quantification: unknown
    unit: gc/wet gram
    reference_event: vaccination
