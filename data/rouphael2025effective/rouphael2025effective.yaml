title: Effective Aerosol Inoculation of Dose-Escalated Seasonal Influenza H3N2 Virus
  in Controlled Human Infection Model
doi: 10.1101/2025.07.23.25332064
description: Dose-escalation controlled human infection study (Feb 2024–Mar 2025)
  evaluating aerosolized inoculation of influenza A/Perth/16/2009 (H3N2) using two
  devices (FMAG and a medical nebulizer) in 14 healthy adults (aged 18–49). Participants
  were challenged in an inpatient unit and monitored daily; molecular (qPCR) and infectious
  (plaque assay) viral loads were measured at multiple upper airway sites (nasopharynx,
  anterior nares, buccal, oropharynx, saliva). Study assessed viral shedding kinetics,
  symptom development (MMID), safety, and seroconversion.
analytes:
  nasopharyngeal_gc_ml:
    description: Quantitative molecular detection of influenza viral RNA from nasopharyngeal
      swab samples by RT-PCR, reported as gene copies per mL (gc/mL).
    specimen: nasopharyngeal_swab
    biomarker: influenza
    limit_of_detection: 501.1872
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: inoculation
  anterior_nasal_gc_ml:
    description: Quantitative molecular detection of influenza viral RNA from anterior
      nasal (anterior nares) swab samples by RT-PCR, reported as gene copies per mL
      (gc/mL).
    specimen: anterior_nares_swab
    biomarker: influenza
    limit_of_detection: 501.1872
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: inoculation
  buccal_gc_ml:
    description: Quantitative molecular detection of influenza viral RNA from buccal
      swab samples (inner cheek) by RT-PCR, reported as gene copies per mL (gc/mL).
    specimen: buccal_swab
    biomarker: influenza
    limit_of_detection: 501.1872
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: inoculation
  oropharyngeal_gc_ml:
    description: Quantitative molecular detection of influenza viral RNA from oropharyngeal
      swab samples by RT-PCR, reported as gene copies per mL (gc/mL).
    specimen: oropharyngeal_swab
    biomarker: influenza
    limit_of_detection: 501.1872
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: inoculation
  saliva_gc_ml:
    description: Quantitative molecular detection of influenza viral RNA from saliva
      samples by RT-PCR, reported as gene copies per mL (gc/mL).
    specimen: saliva
    biomarker: influenza
    limit_of_detection: 501.1872
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: inoculation
  nasopharyngeal_pfu_ml:
    description: Infectious virus quantification by plaque assay from nasopharyngeal
      swab samples, reported as plaque-forming units per mL (pfu/mL).
    specimen: nasopharyngeal_swab
    biomarker: influenza
    limit_of_detection: 5
    limit_of_quantification: unknown
    unit: pfu/mL
    reference_event: inoculation
  anterior_nasal_pfu_ml:
    description: Infectious virus quantification by plaque assay from anterior nasal
      (anterior nares) swab samples, reported as plaque-forming units per mL (pfu/mL).
    specimen: anterior_nares_swab
    biomarker: influenza
    limit_of_detection: 5
    limit_of_quantification: unknown
    unit: pfu/mL
    reference_event: inoculation
  buccal_pfu_ml:
    description: Infectious virus quantification by plaque assay from buccal swab
      samples, reported as plaque-forming units per mL (pfu/mL).
    specimen: buccal_swab
    biomarker: influenza
    limit_of_detection: 5
    limit_of_quantification: unknown
    unit: pfu/mL
    reference_event: inoculation
  oropharyngeal_pfu_ml:
    description: Infectious virus quantification by plaque assay from oropharyngeal
      swab samples, reported as plaque-forming units per mL (pfu/mL).
    specimen: oropharyngeal_swab
    biomarker: influenza
    limit_of_detection: 5
    limit_of_quantification: unknown
    unit: pfu/mL
    reference_event: inoculation
  saliva_pfu_ml:
    description: Infectious virus quantification by plaque assay from saliva samples,
      reported as plaque-forming units per mL (pfu/mL).
    specimen: saliva
    biomarker: influenza
    limit_of_detection: 5
    limit_of_quantification: unknown
    unit: pfu/mL
    reference_event: inoculation
