title: Disease course and viral shedding in experimental Norwalk virus and Snow Mountain
  virus infection
doi: 10.1002/jmv.23905
description: Human challenge study characterizing norovirus stool shedding kinetics
  following experimental inoculation with Norwalk virus (NV; GI.1) or Snow Mountain
  virus (SMV; GII.2). Viral stool titers were measured by quantitative real-time RT-PCR
  over time post-challenge (relative to inoculation); symptomatic status is recorded
  per participant.
analytes:
  stool_norovirus_gc_wet_gram_gi:
    description: Quantitative real-time RT-PCR measurement of Norwalk virus (NV;
      norovirus genogroup GI) RNA concentration in stool. Values provided as gene
      copies per gram (wet weight).
    specimen: stool
    biomarker: norovirus
    genogroup: GI
    limit_of_detection: 3570
    limit_of_quantification: unknown
    unit: gc/wet gram
    reference_event: inoculation
  stool_norovirus_gc_wet_gram_gii:
    description: Quantitative real-time RT-PCR measurement of Snow Mountain virus
      (SMV; norovirus genogroup GII) RNA concentration in stool. Values provided
      as gene copies per gram (wet weight).
    specimen: stool
    biomarker: norovirus
    genogroup: GII
    limit_of_detection: 1790
    limit_of_quantification: unknown
    unit: gc/wet gram
    reference_event: inoculation
