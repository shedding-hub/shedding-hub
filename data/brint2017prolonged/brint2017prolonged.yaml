title: Prolonged viral replication and longitudinal viral dynamic differences among
  respiratory syncytial virus infected infants
doi: 10.1038/pr.2017.173
description: Longitudinal RSV viral load study in 51 naturally infected, hospitalized
  RSV-PCR+ infants (<1 year old) during the 2014–2015 RSV season. Quantitative nasal
  aspirate/nasal wash samples were collected serially during hospitalization and follow-up
  visits up to ~1 month after symptom onset. Viral load was measured using TaqMan-based
  real-time qRT-PCR targeting the RSV N gene with subtype-specific primers (RSV-A
  and RSV-B), and results were reported as plaque-forming unit equivalents per mL.
analytes:
  nasal_aspirate_respiratory_syncytial_virus_viral_load:
    description: RSV viral load quantified from nasal aspirate/nasal wash using RNA
      extraction (Qiagen EZ1 Virus Minikit v2.0 on EZ1 Advanced XL) followed by reverse
      transcription and TaqMan-based real-time qRT-PCR (ABI Prism 7900HT and 7500Fast).
      Assay used custom RSV-A and RSV-B subtype-specific primers targeting the RSV
      N gene; quantification used 10-fold dilution internal standard curves from quantitatively
      cultured RSV-A and RSV-B whole virus. Results reported as PFU equivalents per
      mL; CSV values provided in linear scale corresponding to PFUe/mL (converted
      from reported log10 PFUe/mL in the paper figures).
    specimen: nasopharyngeal_aspirate
    biomarker: RSV
    gene_target: N gene
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: pfu/mL
    reference_event: symptom onset
