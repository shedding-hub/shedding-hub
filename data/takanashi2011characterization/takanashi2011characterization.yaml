title: Characterization of emerging GII.g/GII.12 noroviruses from a gastroenteritis
  outbreak in the United States in 2010
doi: 10.1128/JCM.00305-11
description: Study of a norovirus gastroenteritis outbreak in Ohio (January 2010).
  Stool and saliva samples were obtained from six infected individuals; two representative
  strains were sequenced and characterized as recombinant GII.g (polymerase)/GII.12
  (capsid). Real-time RT-PCR was used to detect/quantify norovirus shedding; one immunocompetent
  2-year-old male shed virus up to 30 days. HBGA typing was performed on saliva to
  assess host susceptibility patterns.
