title: Effect of Norovirus Inoculum Dose on Virus Kinetics, Shedding, and Symptoms
doi: 10.3201/eid2907.230117
description: Secondary analysis of a human norovirus GI.1 challenge study (ClinicalTrials.gov
  NCT00138476) examining how inoculum dose (0.48, 4.8, 48, 4,800 RT-PCR units) affects
  shedding kinetics and symptoms. Feces and vomit samples were collected frequently
  during the first 96 hours after inoculation and then for 4–8 weeks postinoculation.
  Virus shedding was measured by IMC RT-PCR (qualitative) and qRT-PCR (quantitative
  genomic equivalent copies). This extraction contains digitized fecal shedding measurements
  for dose 4,800 RT-PCR units from the provided figure-data CSV (Batch 1/8).
analytes:
  4800_stool:
    description: Norovirus GI.1 challenge study fecal shedding measurement for participants
      inoculated with 4,800 RT-PCR units. Virus shedding concentration measured by
      IMC RT-PCR (qualitative positive/negative) and/or real-time quantitative RT-PCR
      (qRT-PCR) reported as genomic equivalent copies per gram of stool; values below
      assay limits may appear as qualitative results in the digitized dataset.
    specimen: stool
    biomarker: norovirus
    genogroup: GI
    limit_of_detection: 15000
    limit_of_quantification: 40000000
    unit: gc/wet gram
    reference_event: inoculation
