title: Influenza Virus Shedding in Laninamivir-Treated Children upon Returning to
  School
doi: 10.1620/tjem.238.113
description: Study of influenza virus shedding in pediatric patients treated with
  laninamivir during the 2011-2012 influenza season in Niigata Prefecture, Japan.
  Nasal discharge samples were collected at three visits (before treatment, 3-5 days
  after first visit, and 5-9 days after first visit) and assessed by virus culture
  (TCID50) and quantitative real-time PCR targeting the M gene. The paper enrolled
  28 children (7 infected with influenza A(H3N2) and 21 with influenza B) and evaluated
  duration of fever, virus isolation, viral RNA detection rates, and antiviral susceptibility.
  The CSV data provided contain quantitative viral RNA measurements (genome-equivalent
  copies) for a subset of participants.
analytes:
  nasal_discharge_influenza_gc_per_mL:
    description: Quantitative real-time PCR (TaqMan) targeting the influenza M gene
      on nasal discharge specimens. Viral load expressed as genome-equivalent copies
      of viral RNA using a standard curve; samples run in duplicate. A cycle threshold
      (Ct) < 40 was considered positive. Values reported here are genome-equivalent
      copies (converted to numeric).
    specimen: nasal_discharge
    biomarker: influenza
    gene_target: M gene
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: symptom onset
