# yaml-language-server: $schema=http://json-schema.org/draft-07/schema
$defs:
  negative_positive_number:
    description: >
      A quantitative value, or a qualitative result.

      `positive` is a plain detected result, including one above the limit of detection
      but below the limit of quantification. `strong positive` and `weak positive` are
      for studies that grade a positive rather than reporting a single `positive` --
      any qualitative or semiquantitative readout, such as +/++/+++, high/low positive,
      borderline, or band and signal strength. Record the grade the study reports; do
      not infer one from a numeric value, and do not invent a grade a study did not
      report.

      `negative` is a result below the limit of detection. `inconclusive` is an
      indeterminate result the study could not resolve, which is not the same as a weak
      one.
    oneOf:
      - type: number
        exclusiveMinimum: 0 # Zero should be coded as `negative`.
      - type: string
        enum: [strong positive, positive, weak positive, negative, inconclusive]
  specimen_type_enum:
    type: string
    enum:
      - stool
      - sputum
      - urine
      - plasma
      - oropharyngeal_swab
      - oropharyngeal_lavage_fluid
      - nasopharyngeal_swab
      - nasopharyngeal_aspirate
      - anterior_nares_swab
      - saliva
      - buccal_swab
      - rectal_swab
      - anorectal_swab
      - genital_swab
      - unknown
      - bronchoalveolar_lavage_fluid
      - tracheal_aspirate
      - nasal_lavage_fluid
      - nasal_discharge
      - serum
      - emesis
  analyte_specification:
    description: Specification of an analyte.
    type: object
    additionalProperties: false
    properties:
      description:
        type: string
        description: >
          Description of the analyte, e.g., "RdRp gene target for SARS-CoV-2 RNA as
          described in 10.2807/1560-7917.ES.2020.25.3.2000045".
      limit_of_detection:
        description: Lowest value at which the analyte can be detected.
        oneOf:
          - type: number
            exclusiveMinimum: 0
          - const: unknown
      limit_of_quantification:
        description: Lowest value at which the analyte can be reliably quantified.
        oneOf:
          - type: number
            exclusiveMinimum: 0
          - const: unknown
      limit_of_blank:
        description: Highest measurement result observed for a blank sample.
        oneOf:
          - type: number
            exclusiveMinimum: 0
          - const: unknown
      specimen:
        description: Specimen type or array of specimen types for combined samples.
        oneOf:
          - $ref: "#/$defs/specimen_type_enum"
          - type: array
            items:
              $ref: "#/$defs/specimen_type_enum"
            minItems: 2
      biomarker:
        description: Biomarker being measured.
        type: string
        enum:
          - SARS-CoV-2
          - mtDNA
          - PMMoV
          - crAssphage
          - influenza
          - sapovirus
          - norovirus
          - SARS
          - adenovirus
          - RSV
          - rhinovirus
          - Lanzhou lamb rotavirus vaccine
          - rotavirus
          - rotavirus vaccine
          - hepatitis A virus
          - hepatitis E virus
          - mpox
      gene_target:
        description: The gene being targeted in qPCR or ddPCR if a genomic biomarker.
          This field should be left empty for non-genomic biomarkers, e.g., drug
          metabolites.
        type: string
      unit:
        description: Units in which measurements are reported.
        type: string
        enum:
          - gc/dry gram
          - gc/mL
          - gc/swab
          - gc/wet gram
          - gc/reaction
          - gc/ng
          - gc/ng hDNA
          - cycle threshold
          - pfu/mL
          - vp/mL
      reference_event:
        description: Event used as reference for `time` fields of measurements.
        type: string
        enum:
          - symptom onset
          - confirmation date
          - enrollment
          - hospital admission
          - vaccination
          - inoculation
          - exposure
          - treatment
      dose:
        description: >
          Vaccine dose number for vaccine shedding studies (e.g., 1, 2, 3).
          Create separate analytes for each dose if shedding is measured after
          multiple doses.
        type: integer
        minimum: 1
      genogroup:
        description: >
          Genogroup/genotype classification this analyte specifically targets or measures,
          at whatever level of specificity the study reports (e.g., 'GI', 'GII', or the more
          specific 'GI.1', 'GII.4' for norovirus; 'G1', 'G2' for rotavirus). Use this
          analyte-level field when the classification is fixed by which analyte/assay was
          used rather than varying per participant.
        type: string
      transport_medium:
        description: >
          Transport/storage medium the specimen was collected or preserved in before
          testing (e.g., 'UTM', 'VTM', 'saline'). Use when the study distinguishes results
          by transport medium.
        type: string
      vaccine_type:
        description: >
          Type or brand name of vaccine for vaccine shedding studies
          (e.g., 'Rotarix (RV1)', 'RotaTeq (RV5)', 'Lanzhou lamb rotavirus vaccine').
        type: string
    required:
      - biomarker
      - description
      - limit_of_detection
      - limit_of_quantification
      - reference_event
      - specimen
      - unit

type: object
additionalProperties: false
properties:
  doi:
    type: string
    description: >
      Digital object identifier for the source publication, study, or data repository.
  url:
    type: string
    description: Url for the source publication, study, or data repository.
  description:
    type: string
    description: >
      Description of the dataset, including how the data were extracted or obtained. If
      a temporal offset is associated with each sample, e.g., the time since symptom
      onset, the reference event must be described here.
  title:
    type: string
    description: Title of the source publication, study, or data repository.
  analytes:
    type: object
    description: >
      Specification of multiple analytes in this dataset with keys matching the `values`
      property of samples.
    additionalProperties: false
    minProperties: 1
    patternProperties:
      "^.*$":
        $ref: "#/$defs/analyte_specification"
  participants:
    type: array
    description: >
      Array of participants, including their attributes (such as demographics,
      comorbidities, and clinical characteristics) and an array of samples collected
      from the participant. Participants may, for example, include patients who enrolled
      during hospitalization or participants in a prospective study.
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
        - measurements
      properties:
        patient_id:
          description: >
            Identifier of the subject/patient from the data source (e.g., the PatientID
            column). Retained for traceability; groups all of a subject's measurements
            into one participant.
          type: [string, integer]
        attributes:
          type: object
          properties:
            sex:
              description: Sex of the participant at birth.
              type: string
              enum:
                - female
                - male
                - unknown
            age:
              description: >
                Chronological age of the participant in YEARS (how old they are).
                Can be a numeric value or an age range string (e.g., "2-5", "18-65").
              oneOf:
                - type: number
                  minimum: 0
                  maximum: 120
                - type: string
            age_group:
              description: >
                Age group category when exact numeric age is not available.
                Use neonate (0-28 days), infant (29 days to <1 year),
                child (1-17 years), adult (18-65 years), or elderly (over 65 years).
              type: string
              enum:
                - neonate
                - infant
                - child
                - adult
                - elderly
                - unknown
            race:
              description: Race of the participant.
              type: string
              enum:
                - asian
                - black
                - white
                - other
                - unknown
            ethnicity:
              description: Ethnicity of the participant.
              type: string
              enum:
                - hispanic
                - not hispanic
                - unknown
            vaccinated:
              description: >
                Whether the participant was vaccinated against the condition. This is a
                yes/no question: a participant vaccinated after exposure was still
                vaccinated, so use true and leave the timing to the dataset description.
              oneOf:
                - type: boolean
                - type: string
                  const: unknown
            lineage:
              description: Lineage information of the pathogen for the participant.
              type: string
            variant:
              description: Variant information of the pathogen for the participant.
              type: string
            genotype:
              description: >
                Viral genotype information (e.g., 'IB', 'IA' for hepatitis,
                'GII.4' for norovirus, 'G1P[8]' for rotavirus).
              type: string
            subtype:
              description: >
                Pathogen type/subtype of the participant's infection as a single string --
                a specific subtype/lineage designation, never just the pathogen or biomarker
                name itself (e.g., not 'RSV' or 'SARS-CoV-2'). For influenza, the type and
                (when reported) subtype or lineage, e.g., 'A(H1N1)pdm09', 'A(H3N2)', 'B',
                'B/Victoria'. For RSV, 'A' or 'B' when reported per participant.
              type: string
            symptomatic:
              description: >
                Whether the participant is symptomatic.
                Use true for symptomatic, false for asymptomatic.
              oneOf:
                - type: boolean
                - type: string
                  const: unknown
            participant_type:
              description: >
                Type or category of participant (e.g., 'patient', 'healthcare worker',
                'household contact', 'community control', 'index case').
              type: string
            hospitalized:
              description: >
                Whether the participant was hospitalized. Use true for inpatients,
                false for outpatients.
              oneOf:
                - type: boolean
                - type: string
                  const: unknown
            infant:
              description: If the participant was an infant.
              oneOf:
                - type: boolean
                - type: string
                  const: unknown
            full_term:
              description: >
                Whether the infant was born full term.
                Use true for full-term infants, false for premature infants.
              oneOf:
                - type: boolean
                - type: string
                  const: unknown
            immune_status:
              description: >
                Immune competence of the participant. Use immunocompromised for
                participants described as immunocompromised OR immunosuppressed (e.g.,
                transplant recipients, chemotherapy or immunosuppressive therapy,
                primary immunodeficiency, HIV) and immunocompetent otherwise. This
                describes the subject, not a separate analyte.
              type: string
              enum:
                - immunocompetent
                - immunocompromised
                - unknown
            coinfection:
              description: >
                Other pathogen(s) co-detected in the participant besides the study's
                primary biomarker (e.g., 'CoV-OC43', 'human rhinovirus', 'RSV'), or
                'none' when screened and none were found. A coinfection is a different
                pathogen, not a variant of the study pathogen, and not a separate
                analyte.
              type: string
            treatment:
              description: >
                Antiviral or other pathogen-directed treatment the participant received
                that could affect shedding (e.g., 'oseltamivir', 'zanamivir',
                'remdesivir'), or 'untreated' when explicitly untreated. Describes the
                subject, not a separate analyte.
              type: string
        measurements:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            properties:
              time:
                description: >
                  Temporal offset for the sample, e.g., relative to symptom onset, drug
                  ingestion, or hospital admission. The reference event should be
                  defined in the dataset description.
                oneOf:
                  - type: number
                  - const: unknown
              value:
                $ref: "#/$defs/negative_positive_number"
              analyte:
                description: >
                  Analyte for which a measurement is reported. The analyte key must
                  appear in the dictionary of `analytes` metadata.
                type: string
              sample_id:
                description: >
                  Unique sample identifier if multiple measurements are reported for the
                  same sample, e.g., replicates or different analytes.
                type: [string, integer]
              limit_of_quantification:
                description: Lowest value at which the analyte can be reliably quantified.
                oneOf:
                  - type: number
                  - const: unknown
              limit_of_blank:
                description: Highest measurement result observed for a blank sample.
                oneOf:
                  - type: number
                  - const: unknown
            required:
              - analyte
              - time
              - value
required:
  - description
  - participants
  - title
# Require that either url or doi are given.
oneOf:
  - required:
      - url
  - required:
      - doi
