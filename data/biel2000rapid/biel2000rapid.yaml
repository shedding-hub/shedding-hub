title: Rapid quantification and differentiation of human polyomavirus DNA in undiluted
  urine from patients after bone marrow transplantation
doi: 10.1128/JCM.38.10.3689-3695.2000
description: This paper reports development and use of qualitative seminested PCR
  (to discriminate BK vs JC virus) and quantitative TaqMan PCR for detecting/quantifying
  human polyomavirus DNA in urine specimens from patients after bone marrow transplantation.
  The quantitative assay is reported to be linear from 10^7 to 10^1 copies per assay.
  CSV-extracted longitudinal urine viral DNA measurements are provided here as time
  series per patient.
analytes:
  urine_polyomavirus_dna:
    description: Quantitative TaqMan PCR (TM-PCR) assay for general detection/quantification
      of human polyomavirus (huPoV) DNA in urine; assay linear range reported as 10^7
      to 10^1 copies per assay. The TM-PCR assay itself does not discriminate BK from
      JC virus, but per Fig. 8, all four patients shown here were confirmed positive
      for BKV only (not JCV) throughout the time course by the separate seminested
      PCR (snPCR) discrimination assay.
    specimen: urine
    biomarker: BK polyomavirus
    gene_target: VP1
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: treatment
