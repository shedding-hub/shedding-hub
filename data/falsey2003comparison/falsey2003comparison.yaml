title: Comparison of quantitative reverse transcription-PCR to viral culture for assessment
  of respiratory syncytial virus shedding
doi: 10.1128/JCM.41.9.4160-4165.2003
description: Comparative study of RSV shedding in adult volunteers experimentally
  challenged with RSV A2, comparing quantitative real-time RT-PCR results with viral
  culture across multiple postinfection days (0-12 and day 28). CSV-provided measurements
  represent a time series per subject (PatientID 1-5) with values recorded by day
  relative to infection/challenge.
analytes:
  nasal_respiratory_syncytial_virus_quant_rt_pcr:
    description: Quantitative real-time RT-PCR measurement of respiratory syncytial
      virus (RSV) from respiratory specimens collected in an adult RSV A2 challenge
      study; numeric values provided in CSV (assay details, gene target, and calibration/units
      not provided in the supplied text/CSV).
    specimen: nasal_lavage_fluid
    biomarker: RSV
    gene_target: F gene
    limit_of_detection: 10
    limit_of_quantification: unknown
    unit: pfu/mL
    reference_event: inoculation
