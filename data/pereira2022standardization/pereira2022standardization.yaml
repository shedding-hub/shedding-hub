title: Standardization of a high-performance RT-qPCR for viral load absolute quantification
  of influenza A
doi: 10.1016/j.jviromet.2021.114439
description: Methods/assay standardization study that developed and analytically validated
  an RT-qPCR absolute quantification assay for influenza A (M gene target) using a
  plasmid DNA standard. The assay (WHO 2009 M-gene RT-qPCR) was applied to clinical
  respiratory specimens from a cohort at Hospital de Clínicas, Universidade Federal
  do Paraná (Curitiba, Brazil). Serial viral-load measurements were obtained for 19
  hospitalized SARI patients with two collections (timed by days from symptom onset),
  including immunocompetent and immunosuppressed participants, to assess viral-load
  dynamics.
analytes:
  respiratory_influenzaA_viral_load:
    description: Influenza A viral load by one-step RT-qPCR targeting the influenza
      A M matrix gene using WHO (2009) primer/probe set on a ViiA 7 Real-Time PCR
      system. RNA extracted from 200 µL clinical sample (QIAamp Viral RNA Mini Kit).
      Absolute quantification used a plasmid DNA standard curve (six standards, 10^1
      to 10^6 copies/reaction in triplicate). The per-patient serial values here are
      the absolute quantities tabulated in the paper's Table 2, in copies/reaction;
      LOD 6.77 and LOQ 20.52 are reported in the same unit. (The paper additionally
      converts these to copies/mL and presents Log10 copies/mL in its figures, but
      the per-patient data used here are the Table 2 copies/reaction values.)
    specimen:
    - nasopharyngeal_aspirate
    - nasopharyngeal_swab
    biomarker: influenza
    gene_target: M
    limit_of_detection: 6.77
    limit_of_quantification: 20.52
    unit: gc/reaction
    reference_event: symptom onset
