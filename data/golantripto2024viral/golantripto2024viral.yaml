title: 'Viral load in hospitalized infants with respiratory syncytial virus bronchiolitis:
  a three-way comparative analysis'
doi: 10.1007/s00431-024-05614-3
description: 'Prospective cohort study of hospitalized infants (<12 months) with acute
  bronchiolitis at Soroka Medical Center. For each infant, paired respiratory specimens
  were collected at hospital admission (day 0) and ~48 hours later (day 2): nasopharyngeal
  swabs and nasal lavage (nasal wash) fluid, each placed in two different transport
  media (UTM and VCM). Quantitative RT-PCR viral load results (reported as virus particles
  per mL, vp/mL) are provided here from figure-derived CSV data, stratified by specimen
  type and transport medium; RSV subtype (A or B) is available per patient in the
  CSV.'
analytes:
  utm_vp_ml_nasopharyngeal_swab:
    description: Quantitative RT-PCR viral load reported as virus particles per mL
      (vp/mL) from nasopharyngeal (nasal) swab specimens collected at hospital admission
      (day 0) and 48 hours later (day 2), stored and tested as described in the paper;
      specimen placed into UTM transport medium.
    specimen: nasopharyngeal_swab
    biomarker: RSV
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: vp/mL
    reference_event: hospital admission
  vcm_vp_ml_nasopharyngeal_swab:
    description: Quantitative RT-PCR viral load reported as virus particles per mL
      (vp/mL) from nasopharyngeal (nasal) swab specimens collected at hospital admission
