      (vp/mL) from nasal lavage (nasal wash) fluid specimens collected at hospital
      admission (day 0) and 48 hours later (day 2), stored and tested as described
      in the paper; specimen placed into UTM transport medium.
    specimen: nasal_lavage_fluid
    biomarker: RSV
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: vp/mL
    reference_event: hospital admission
