title: Adenovirus viremia may predict adenovirus pneumonia severity in immunocompetent
  children
doi: 10.1186/s12879-021-05903-4
description: Retrospective observational study of immunocompetent children hospitalized
  with adenovirus pneumonia at Shenzhen Children’s Hospital (Shenzhen, China) between
  May and August 2019. Serum adenovirus DNA was quantified by commercial fluorescence
  quantitative PCR (Daan Gene) to assess associations between adenovirus viremia/blood
  viral load and pneumonia severity; a subset of 7 children had serial blood viral
  load monitoring during recovery (figure-derived CSV).
analytes:
  serum_adenovirus_viral_load:
    description: Adenovirus DNA quantified in serum using a commercial fluorescence
      quantitative PCR kit (Daan Gene, Guangzhou, China). Samples transported to laboratory
      within 4 h and serum stored at −80°C until PCR. LOD reported as 500 copies/mL;
      values below LOD treated as negative in shedding time series (figure), while
      the paper notes for some analyses below-LOD values were assigned 0 log10 copies/mL.
    specimen: serum
    biomarker: adenovirus
    limit_of_detection: 500
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: confirmation date
