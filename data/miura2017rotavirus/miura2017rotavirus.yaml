title: Rotavirus vaccine strain transmission by vaccinated infants in the foster home
doi: 10.1002/jmv.24613
description: Prospective surveillance in a foster home setting assessing shedding
  and transmission of rotavirus vaccine strains. Stool samples were collected and
  tested by quantitative real-time RT-PCR. The study included 4 RV-vaccinated infants
  (160 samples) and 23 unvaccinated infants (766 samples). Vaccine-strain RNA was
  persistently detected in stool from the four vaccine recipients and in one unvaccinated
  infant (who had been vaccinated prior to enrollment). Quantitative RT-PCR data showed
  a peak RNA load about 1 week after vaccination followed by gradual decrease. Study
  suggests limited transmission of vaccine strains in close-contact environment.
