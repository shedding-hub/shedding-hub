title: 'Viral dynamics of the Respiratory Syncytial Virus during experimental human
  challenge: insights for transmission and protection'
doi: 10.1093/infdis/jiag206
description: Human RSV challenge study in adults analyzing high-resolution viral kinetics
  using mathematical models. Figure-derived CSV data provide RSV RNA concentrations
  (gc/mL) and infectious virus titers (pfu/mL) over days post-exposure for individual
  participants (PatientID). The study report the specimen as nasal samples, and we consider these to 
  be nasopharyngeal aspirates based on the methods description. The study does not provide assay details for the viral RNA or infectious virus measurements.
analytes:
  gc_ml:
    description: RSV viral RNA concentration quantified from respiratory samples;
      values provided as gene copies per mL (gc/mL) from figure-derived CSV. Assay
      method/gene target not provided in the supplied text/CSV.
    specimen: nasopharyngeal_aspirate
    biomarker: RSV
    limit_of_detection: unknown
    limit_of_quantification: 630.9573
    unit: gc/mL
    reference_event: inoculation
  pfu_ml:
    description: RSV infectious virus titer measured as plaque forming units per mL
      (pfu/mL) from figure-derived CSV. Assay method not provided in the supplied
      text/CSV.
    specimen: nasopharyngeal_aspirate
    biomarker: RSV
    limit_of_detection: unknown
    limit_of_quantification: 100
    unit: pfu/mL
    reference_event: inoculation
