title: 'Norovirus in symptomatic and asymptomatic individuals: cytokines and viral
  shedding'
doi: 10.1111/cei.12772
description: Human norovirus GI.1 challenge study comparing symptomatic vs asymptomatic
  infected individuals, relating stool norovirus RNA titers (from prior RT-qPCR quantification)
  to serum cytokine responses. This extraction contains stool viral shedding measurements
  (GEC/g) digitized from a figure-data CSV (batch 1/4) for 6 symptomatic participants
  (PatientID 1-6), with time in days relative to inoculation/challenge (day 0 = prechallenge).
analytes:
  gec_g:
    description: Stool norovirus GI.1 RNA quantity measured as genome equivalent copies
      per gram (GEC/g), quantified previously by RT-qPCR; values here are from figure-data
      CSV for symptomatic participants.
    specimen: stool
    biomarker: norovirus
    genogroup: GI.1
    limit_of_detection: 3570
    limit_of_quantification: unknown
    unit: gc/wet gram
    reference_event: inoculation
