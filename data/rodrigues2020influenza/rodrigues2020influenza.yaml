title: Influenza A(H1N1)pdm09 infection and viral load analysis in patients with different
  clinical presentations
doi: 10.1590/0074-02760200009
description: Study of H1N1pdm09 viral load (VL) in respiratory samples collected 2009-2013
  at a tertiary hospital in São Paulo, Brazil. Samples from asymptomatic (AS), symptomatic
  outpatients (OP) and hospitalised patients (HP) were tested by quantitative one-step
  real-time RT-PCR targeting the M gene; VL reported as Log10 RNA copies/mL in the
  paper. A subset of 10 hospitalised patients treated with oseltamivir were followed
  longitudinally and serial VL measurements (days of treatment) are provided (Fig.2
  / CSV).
analytes:
  respiratory_influenza_viral_load:
    description: Quantitative one-step real-time RT-PCR targeting the influenza M
      gene. Human RNaseP was used as internal control and Ct values were normalised;
      viral load expressed as RNA copies per mL (paper reports Log10 RNA copies/mL;
      CSV measurements are linear copies/mL). Respiratory specimens included nasopharyngeal
      aspirates (children <2 years) and nasal/oropharyngeal swabs for other patients.
      Serial measurements in the CSV correspond to days of oseltamivir treatment (Fig.2).
    specimen:
    - nasopharyngeal_swab
    - oropharyngeal_swab
    biomarker: influenza
    gene_target: M gene
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: treatment
