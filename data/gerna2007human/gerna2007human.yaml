title: The human bocavirus role in acute respiratory tract infections of pediatric
  patients as defined by viral load quantification
url: https://pubmed.ncbi.nlm.nih.gov/18080673/
description: Hospital-based study of acute respiratory tract infection patients testing
  for human bocavirus (HBoV) and other respiratory viruses using PCR, with HBoV DNA
  quantified in respiratory samples (nasopharyngeal aspirates per abstract). CSV-derived
  longitudinal/paired measurements are reported relative to either hospital admission
  or confirmation date for bocavirus and several co-detected respiratory viruses (RSV,
  rhinovirus, parainfluenza virus, adenovirus, coronavirus). We could not find a DOI
  for this paper; it is not available.
analytes:
  hospital_admission_bocavirus:
    description: PCR-based detection/quantification of human bocavirus (HBoV) in respiratory
      samples; measurements timed relative to hospital admission (day 0 = admission).
    specimen: nasopharyngeal_aspirate
    biomarker: bocavirus
    gene_target: NS1
    limit_of_detection: unknown
    limit_of_quantification: 1000
    unit: gc/mL
    reference_event: hospital admission
  hospital_admission_rsv:
    description: PCR-based detection/quantification of respiratory syncytial virus
      (RSV) in respiratory samples; measurements timed relative to hospital admission
      (day 0 = admission).
    specimen: nasopharyngeal_aspirate
    biomarker: RSV
    limit_of_detection: unknown
    limit_of_quantification: 1000
    unit: gc/mL
    reference_event: hospital admission
  hospital_admission_rhinovirus:
    description: PCR-based detection/quantification of rhinovirus in respiratory samples;
      measurements timed relative to hospital admission (day 0 = admission).
    specimen: nasopharyngeal_aspirate
    biomarker: rhinovirus
    limit_of_detection: unknown
    limit_of_quantification: 1000
    unit: gc/mL
    reference_event: hospital admission
  hospital_admission_parainfluenza_virus:
    description: PCR-based detection/quantification of parainfluenza virus in respiratory
      samples; measurements timed relative to hospital admission (day 0 = admission).
    specimen: nasopharyngeal_aspirate
    biomarker: parainfluenza virus
    limit_of_detection: unknown
    limit_of_quantification: 1000
    unit: gc/mL
    reference_event: hospital admission
  hospital_admission_adenovirus:
    description: PCR-based detection/quantification of adenovirus in respiratory samples;
      measurements timed relative to hospital admission (day 0 = admission).
    specimen: nasopharyngeal_aspirate
    biomarker: adenovirus
    limit_of_detection: unknown
    limit_of_quantification: 1000
    unit: gc/mL
    reference_event: hospital admission
  confirmation_date_bocavirus:
    description: PCR-based detection/quantification of human bocavirus (HBoV) in respiratory
      samples; measurements timed relative to confirmation date (day 0 = first positive/confirmation).
    specimen: nasopharyngeal_aspirate
    biomarker: bocavirus
    gene_target: NS1
    limit_of_detection: unknown
    limit_of_quantification: 1000
    unit: gc/mL
    reference_event: confirmation date
  confirmation_date_rsv:
    description: PCR-based detection/quantification of respiratory syncytial virus
      (RSV) in respiratory samples; measurements timed relative to confirmation date
      (day 0 = first positive/confirmation).
    specimen: nasopharyngeal_aspirate
    biomarker: RSV
    limit_of_detection: unknown
    limit_of_quantification: 1000
    unit: gc/mL
    reference_event: confirmation date
  confirmation_date_rhinovirus:
    description: PCR-based detection/quantification of rhinovirus in respiratory samples;
      measurements timed relative to confirmation date (day 0 = first positive/confirmation).
    specimen: nasopharyngeal_aspirate
    biomarker: rhinovirus
    limit_of_detection: unknown
    limit_of_quantification: 1000
    unit: gc/mL
    reference_event: confirmation date
  confirmation_date_coronavirus:
    description: PCR-based detection/quantification of seasonal human coronavirus
      in respiratory samples; measurements timed relative to confirmation date (day
      0 = first positive/confirmation).
    specimen: nasopharyngeal_aspirate
    biomarker: coronavirus
    limit_of_detection: unknown
    limit_of_quantification: 1000
    unit: gc/mL
    reference_event: confirmation date
  confirmation_date_parainfluenza_virus:
    description: PCR-based detection/quantification of parainfluenza virus in respiratory
      samples; measurements timed relative to confirmation date (day 0 = first positive/confirmation).
    specimen: nasopharyngeal_aspirate
    biomarker: parainfluenza virus
    limit_of_detection: unknown
    limit_of_quantification: 1000
    unit: gc/mL
    reference_event: confirmation date
  confirmation_date_adenovirus:
    description: PCR-based detection/quantification of adenovirus in respiratory samples;
      measurements timed relative to confirmation date (day 0 = first positive/confirmation).
    specimen: nasopharyngeal_aspirate
    biomarker: adenovirus
    limit_of_detection: unknown
    limit_of_quantification: 1000
    unit: gc/mL
    reference_event: confirmation date
