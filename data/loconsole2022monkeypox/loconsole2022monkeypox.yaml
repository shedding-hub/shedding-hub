title: 'Monkeypox Virus Infections in Southern Italy: Is There a Risk for Community
  Spread?'
doi: 10.3390/ijerph191811719
description: Surveillance-based case series of 10 mpox (MPXV) cases identified in
  the Apulia region (Southern Italy) between 1 June and 1 August 2022. Multiple clinical
  specimens (skin lesion swab, nasopharyngeal swab, and whole blood) were tested using
  real-time PCR (Real-Star Orthopoxvirus PCR kit followed by an MPXV-specific confirmatory
  real-time PCR). The dataset reports quantification cycle (Cq) values or negative
  results, with sampling times reported as days from symptom onset.
curation:
  method: ai_assisted
  data_source:
    - main_text
    - table
  extracted_on: '2026-09-17'
analytes:
  skin_lesion_swab:
    description: Mpox virus DNA real-time PCR quantification cycle (Cq) from skin
      lesion swab samples (Orthopoxvirus real-time PCR screening using Real-Star Orthopoxvirus
      PCR Kit with confirmatory MPXV-specific real-time PCR).
    specimen: skin_lesion
    biomarker: mpox
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
  nasopharyngeal_swab:
    description: Mpox virus DNA real-time PCR quantification cycle (Cq) from nasopharyngeal
      swab samples (Orthopoxvirus real-time PCR screening using Real-Star Orthopoxvirus
      PCR Kit with confirmatory MPXV-specific real-time PCR).
    specimen: nasopharyngeal_swab
    biomarker: mpox
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
  blood:
    description: Mpox virus DNA real-time PCR quantification cycle (Cq) from whole
      blood samples (Orthopoxvirus real-time PCR screening using Real-Star Orthopoxvirus
      PCR Kit with confirmatory MPXV-specific real-time PCR).
    specimen: blood
    biomarker: mpox
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
