title: Viral shedding and susceptibility to oseltamivir in hospitalized immunocompromised
  patients with influenza in the Influenza Resistance Information Study (IRIS)
doi: 10.3851/IMP2957
description: Observational substudy of the Influenza Resistance Information Study
  (IRIS) in immunocompromised patients with influenza. Nasal and throat swabs were
  analysed by RT-PCR on day 1 and then every 3 days until patients were virus-free
  to assess viral shedding and emergence of oseltamivir resistance (H275Y). Of 42
  enrolled patients, 29 were influenza RT-PCR positive on day 1 (18 adults, 11 children).
  Resistance (H275Y) was detected in some post-baseline samples; clinical and virological
  outcomes were described.
analytes:
  particles_ml:
    description: RT-PCR quantification of influenza virus from nasal and throat (nasopharyngeal
      and oropharyngeal) swabs. Values reported as particles per mL in the source
      CSV and represented here as virus particles per mL (vp/mL). Genotype (e.g., H, H+Y)
      was reported per sample in the CSV; gene target not specified in the provided
      data.
    specimen:
    - nasopharyngeal_swab
    - oropharyngeal_swab
    biomarker: influenza
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: vp/mL
    reference_event: enrollment
