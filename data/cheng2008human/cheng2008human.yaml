title: 'Human Bocavirus in Children Hospitalized for Acute Gastroenteritis: A Case-Control
  Study'
doi: 10.1086/589244
description: Case-control study of children <5 years old in Lanzhou, China (July 2006–September
  2007) comparing hospitalized acute gastroenteritis cases (n=397) vs asymptomatic
  controls (n=115). Stool specimens were tested for human bocavirus (HBoV) by conventional
  PCR (NS1) and quantified by real-time PCR targeting NS1 using plasmid standards;
  other enteric viruses were also assessed. The provided figure-derived CSV contains
  individual HBoV stool viral load measurements (copies/mL of extract) for 18 HBoV-positive
  case and control children at a single timepoint (time=0).
analytes:
  stool_bocavirus_viral_load:
    description: 'Human bocavirus (HBoV) DNA quantification from stool extracts using
      real-time PCR targeting an 88-bp region of the NS1 gene (primers/probe per Lu
      et al. 2006). Quantification used serial dilutions of pGEMT Easy vector containing
      the HBoV NS1 gene as standards on a Rotor-Gene 3000 system. Minimum viral load
      allowing reproducible quantification: 10 copies per reaction. Reported results
      in the CSV are in copies/mL of extract.'
    specimen: stool
    biomarker: bocavirus
    gene_target: NS1
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: confirmation date
