title: 'Infectious viral shedding of SARS-CoV-2 Delta following vaccination: A longitudinal
  cohort study'
doi: 10.1371/journal.ppat.1010802
description: Longitudinal cohort study (San Francisco Bay Area, Sep 2020–Oct 2021)
  comparing nasal SARS-CoV-2 RNA and infectious virus shedding in 84 non-hospitalized
  adults (52 unvaccinated, 32 fully vaccinated). Participants self-collected anterior
  nasal swabs daily for up to 14 days and intermittently to day 28. RT-qPCR quantified
  N and E gene copies/mL using plasmid standards; viral culture (CPE) and plaque assays
  on Vero-hACE2-TMPRSS2 cells assessed infectious virus. Time values are reported
  relative to symptom onset. The provided CSV contains per-participant quantitative
  RT-qPCR measurements for N and E (copies/mL) and vaccination category.
analytes:
  e:
    description: RT-qPCR quantification of SARS-CoV-2 envelope (E) gene from anterior
      nares swabs. Absolute quantification used a 10-fold serial dilution of plasmid
      standards containing E and N genes; reactions run on a CFX Connect system. Samples
      were self-collected anterior nasal swabs stored in VTM and processed as described
      in methods. Values reported as copies per mL derived from the standard curve.
    specimen: anterior_nares_swab
    biomarker: SARS-CoV-2
    gene_target: E
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: symptom onset
  n:
    description: RT-qPCR quantification of SARS-CoV-2 nucleocapsid (N) gene from anterior
      nares swabs. Absolute quantification used a 10-fold serial dilution of plasmid
      standards containing N and E genes; reactions run on a CFX Connect system. Samples
      were self-collected anterior nasal swabs stored in VTM and processed as described
      in methods. Values reported as copies per mL derived from the standard curve.
    specimen: anterior_nares_swab
    biomarker: SARS-CoV-2
    gene_target: N
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: symptom onset
