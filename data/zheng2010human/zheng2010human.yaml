title: Human bocavirus infection in young children with acute respiratory tract infection
  in Lanzhou, China
doi: 10.1002/jmv.21689
description: Prospective 1-year study in Lanzhou, China, enrolling 406 children <14
  years old with acute respiratory tract infection. Human bocavirus (HBoV) was detected
  in 29 children by real-time PCR using nasopharyngeal aspirates; viral loads in positives
  ranged from 5.80×10^2 to 9.72×10^8 copies/mL. Coinfections with other respiratory
  viruses were common (notably RSV).
analytes:
  nasopharyngeal_aspirate_bocavirus_viral_load:
    description: Human bocavirus (HBoV) genome quantification by real-time PCR in
      nasopharyngeal aspirates; values reported as genome copies per mL.
    specimen: nasopharyngeal_aspirate
    biomarker: bocavirus
    gene_target: NP-1
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: enrollment
