title: Viral shedding and immune responses to respiratory syncytial virus infection
  in older adults
doi: 10.1093/infdis/jit038
description: Observational study of RSV infection in adults (Rochester, New York;
  winters 2005–2008) including outpatients (mild disease) and hospitalized patients
  (severe disease). RSV RNA was detected by real-time RT-PCR and viral titers were
  quantified by quantitative RT-PCR and expressed as PFU equivalents per mL. Serial
  respiratory specimens were collected during illness (daily when possible) until
  two consecutive RT-PCR negative samples; additional planned follow-ups occurred
  around days 12–16 and 25–32 after symptom onset. Figure-derived CSV data provide
  individual-level PFU/mL viral load measurements over time for a subset of participants.
  The data used here were extracted from Supplementary Figures 3 of "Relating In Vivo
  Respiratory Syncytial Virus Infection Kinetics to Host Infectiousness in Different
  Age Groups," which digitized and re-plotted the original viral-load curves from this
  study.
analytes:
  pfu_ml:
    description: Quantitative RSV viral load expressed as plaque-forming unit (PFU)
      equivalents per mL of sample, determined by quantitative RSV RT-PCR on respiratory
      specimens (nasal swab/sputum per methods); CSV provides time-series PFU/mL values
      including negatives.
    specimen:
    - anterior_nares_swab
    - sputum
    biomarker: RSV
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: pfu/mL
    reference_event: symptom onset
