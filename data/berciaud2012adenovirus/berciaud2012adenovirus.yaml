title: 'Adenovirus infections in Bordeaux University Hospital 2008-2010: clinical
  and virological features'
doi: 10.1016/j.jcv.2012.04.009
description: Retrospective hospital-based study at Bordeaux University Hospital (France)
  covering 2008-2010 describing clinical characteristics and molecular epidemiology
  of adenovirus infections. Adenovirus DNA was quantified by qPCR across multiple
  specimen types and typed by sequencing (hexon and protein VI genes) and PCR product
  analysis. The extracted figure-derived CSV provides longitudinal stool adenovirus
  DNA loads (gc/wet gram) for immunocompromised patients treated with cidofovir, with
  time values as reported in the CSV (days relative to an unspecified reference event
  in the figure 3 data).
analytes:
  stool_gc_wet_gram:
    description: 'Quantification of adenovirus DNA in stool by qPCR (as described
      in the study: adenovirus DNA quantification by qPCR; typing performed by sequencing
      of hexon and protein VI genes). Figure-derived data provide stool viral load
      values reported as gene copies per wet gram.'
    specimen: stool
    biomarker: adenovirus
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: gc/wet gram
    reference_event: treatment
