title: Clinical and virological characteristics of viral shedding in children with
  norovirus gastroenteritis
doi: 10.1016/j.jmii.2021.10.006
description: Study of pediatric norovirus gastroenteritis cases admitted to Chang
  Gung Memorial Hospital (Taiwan) during 2017–2018. Norovirus was quantified from
  fecal specimens using a SYBR Green-based real-time qRT-PCR method and genotypes
  were characterized by sequencing. CSV figure data provide norovirus concentrations
  over days after symptom onset, reported either as gc/mL (many participants) or gc/wet
  gram (one immunocompromised patient with prolonged shedding).
analytes:
  gc_ml:
    description: Norovirus RNA concentration measured by SYBR Green-based real-time
      quantitative RT-PCR (qRT-PCR) from fecal specimen extract; values reported as
      gene copies per mL (gc/mL).
    specimen: stool
    biomarker: norovirus
    gene_target: RdRp
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: confirmation date
  gc_wet_gram:
    description: Norovirus RNA concentration measured by SYBR Green-based real-time
      quantitative RT-PCR (qRT-PCR) from stool; values reported as gene copies per
      wet gram (gc/wet gram).
    specimen: stool
    biomarker: norovirus
    gene_target: RdRp
    limit_of_detection: 50
    limit_of_quantification: unknown
    unit: gc/wet gram
    reference_event: confirmation date
