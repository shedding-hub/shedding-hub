title: Epidemiological, clinical and virological characteristics of four cases of
  monkeypox support transmission through sexual contact, Italy, May 2022
doi: 10.2807/1560-7917.ES.2022.27.22.2200421
description: Case series of four mpox (MPXV) infections detected in central Italy
  in May 2022 in adult men who have sex with men. Multiple specimen types (including
  genital/rectal lesions, nasopharyngeal swab, serum, plasma, scab, stool/faeces,
  saliva, and seminal fluid) were tested by real-time PCR for MPXV DNA; results are
  reported as PCR quantification cycle (Cq) values at specific days after symptom
  onset.
curation:
  method: ai_assisted
  data_source:
    - main_text
    - table
  extracted_on: '2026-09-17'
analytes:
  genital_or_rectal_lesions:
    description: MPXV DNA detection by real-time PCR; results reported as quantification
      cycle (Cq) values for genital or rectal lesion samples. Screening used Real-Star
      Orthopoxvirus PCR Kit (Altona); confirmatory PCR was G2R_G assay (Li et al.)
      targeting TNF receptor gene; run on Rotor-Gene Q after nucleic acid extraction
      with QIAamp Viral RNA Mini Kit.
    specimen: genital_or_rectal_lesion
    biomarker: mpox
    gene_target: G2R_G (TNF receptor gene); Orthopoxvirus-common target (screening
      kit)
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
