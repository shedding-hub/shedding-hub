title: Isolation of viable monkeypox virus from anal and urethral swabs, Italy, May
  to July 2022
doi: 10.2807/1560-7917.ES.2022.27.36.2200675
description: Study of 33 laboratory-confirmed mpox cases attending a sexual health
  clinic in Milan, Italy (15 May–7 July 2022). Anal (rectal) and urethral swabs were
  tested for MPXV DNA by real-time PCR (reported as Cq) and, when PCR-positive, were
  inoculated on Vero E6 cells to attempt viral isolation; culture positivity/negativity
  (and time-to-positivity) were reported in the paper table, while the provided figure
  CSV contains Cq values over time (days since symptom onset) for anal and urethral
  swabs.
curation:
  method: ai_assisted
  data_source:
    - main_text
    - table
  extracted_on: '2026-09-17'
analytes:
  anorectal_swab:
    description: MPXV DNA real-time PCR quantification cycle (Cq) values from anal
      (rectal) swabs; swabs collected in Universal Transport Medium (UTM-RT, Copan).
      Orthopoxvirus screening PCR (RealStar Orthopoxvirus PCR Kit 1.0) with confirmation
      by an in-house MPXV-specific real-time PCR. Values here are Cq (cycle threshold)
      reported by the study.
    specimen: anorectal_swab
    biomarker: mpox
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
  urethral_swab:
    description: MPXV DNA real-time PCR quantification cycle (Cq) values from urethral
      swabs; swabs collected in Universal Transport Medium (UTM-RT, Copan). Orthopoxvirus
      screening PCR (RealStar Orthopoxvirus PCR Kit 1.0) with confirmation by an in-house
      MPXV-specific real-time PCR. Values here are Cq (cycle threshold) reported by
      the study.
    specimen: urethral_swab
    biomarker: mpox
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
