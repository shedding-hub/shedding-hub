title: The role of human Metapneumovirus genetic diversity and nasopharyngeal viral
  load on symptom severity in adults
doi: 10.1186/s12985-018-1005-8
description: Adult outpatient acute upper respiratory tract infection cohort recruited
  at the University of Malaya Medical Centre (Kuala Lumpur, Malaysia) between February
  2012 and May 2014. Nasopharyngeal swabs were collected in universal transport media
  and tested for human metapneumovirus (HMPV). HMPV-positive samples were genotyped/sub-lineaged
  by sequencing (F and G genes), and viral load was quantified using an improved one-step
  RT-qPCR assay targeting the HMPV M2 gene. Measurements are reported as RNA copies
  per microliter of sample, with sampling time in days since symptom onset. CSV-provided
  data include 75 per-sample viral load measurements with participant-level attributes
  (genotype/sub-lineage, sex, ethnicity, age).
analytes:
  nasopharyngeal_swab_metapneumovirus_viral_load:
    description: Quantification of HMPV RNA from nasopharyngeal swabs using a quantitative
      one-step RT-qPCR assay with newly designed primers/probe targeting the conserved
      M2 gene region; run on ABI ViiA7. Standard curve generated from 10-fold dilution
      series (2.0×10^1 to 2.0×10^6 RNA copies/μL). Specimens collected in universal
      transport media (Copan). Lowest quantifiable concentration estimated at ~13
      RNA copies/μL.
    specimen: nasopharyngeal_swab
    biomarker: metapneumovirus
    gene_target: M2
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: symptom onset
