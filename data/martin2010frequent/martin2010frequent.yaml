title: Frequent and prolonged shedding of bocavirus in young children attending daycare
doi: 10.1086/652405
description: Prospective longitudinal respiratory illness surveillance study of children
  attending daycare centers on Fort Lewis Army Base (Washington State, USA; surveillance
  Feb 2006–Apr 2008). Nasal swabs were collected at enrollment (sometimes asymptomatic)
  and weekly during respiratory illnesses, then tested retrospectively for human bocavirus
  (HBoV) by real-time PCR targeting the NP1 gene. Quantitative HBoV results were derived
  from a standard curve and reported as copies per mL of lysis buffer. CSV-derived
  measurements here provide longitudinal nasal HBoV quantities/positivity over time
  (days relative to enrollment baseline in the figure-derived dataset).
analytes:
  nasal_hbov_viral_load:
    description: Human bocavirus (HBoV) real-time PCR targeting the NP1 gene. Study
      testing provided semiquantitative Ct results; for specimens with sufficient
      volume, Ct values were compared to a standard curve from a plasmid containing
      the HBoV amplicon to estimate viral quantity. Quantitative results reported
      as copies of virus per mL of lysis buffer. The figure-derived CSV contains a
      mix of numeric quantities and qualitative positive/negative calls.
    specimen: nasopharyngeal_swab
    biomarker: bocavirus
    gene_target: NP1
    limit_of_detection: 10000
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: enrollment
