title: 'Monkeypox-related ophthalmic disease (MPXROD): Monitoring the antiviral effect
  of tecovirimat with monkeypox virus detection in tear samples'
doi: 10.1177/11206721241272199
description: Case report of mpox-related ophthalmic disease treated with tecovirimat,
  monitoring mpox virus (MPXV) detection in tear-wash samples using real-time PCR
  over time in both eyes (OD and OS). One adult male patient (HIV-positive) had serial
  tear-wash measurements reported at days 0, 7, 14, and 28 relative to treatment initiation
  (tecovirimat).
