title: Respiratory syncytial virus load, viral dynamics, and disease severity in previously
  healthy naturally infected children
doi: 10.1093/infdis/jir494
description: Observational study of previously healthy children <2 years old with
  naturally acquired RSV infection; RSV load in respiratory secretions was measured
  by fresh quantitative culture over serial hospital days to evaluate viral dynamics
  and associations with disease severity outcomes (eg, length of hospitalization,
  ICU requirement, respiratory failure).
analytes:
  respiratory_secretions_RSV_viral_load:
    description: RSV viral load in respiratory secretions measured by fresh quantitative
      culture (reported as quantitative values; negatives indicate not detected by
      culture).
    specimen: nasopharyngeal_aspirate
    biomarker: RSV
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: pfu/mL
    reference_event: enrollment
