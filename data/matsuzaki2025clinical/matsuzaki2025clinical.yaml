    description: Quantitative real-time RT-PCR Ct value for influenza C virus from
      nasopharyngeal (nasal) swab respiratory specimen; influenza C detected by previously
      described assay (not in multiplex kit).
    specimen: nasopharyngeal_swab
    biomarker: influenza
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
