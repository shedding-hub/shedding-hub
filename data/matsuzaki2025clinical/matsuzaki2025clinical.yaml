title: Clinical Impact of Co-pathogens in Children Infected With Influenza C Virus
  Based on Viral Load in Clinical Specimens
doi: 10.1097/INF.0000000000004897
description: Retrospective analysis of pediatric respiratory infection cases in Japan
  (11 cases in tables; additional figure/CSV patient IDs present) where influenza
  C virus and co-pathogens were detected from respiratory specimens. Viruses were
  isolated by cell culture, detected by multiplex real-time PCR and/or targeted PCR,
  complemented by next-generation sequencing, and viral load quantified by quantitative
  real-time PCR (Ct and genome copies). Clinical symptoms were reviewed to assess
  etiologic role of co-pathogens relative to influenza C viral load.
analytes:
