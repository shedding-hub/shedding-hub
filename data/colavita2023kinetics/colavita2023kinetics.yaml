title: Kinetics of viral DNA in body fluids and antibody response in patients with
  acute Monkeypox virus infection
doi: 10.1016/j.isci.2023.106102
description: Case series follow-up study of three mpox (Monkeypox virus, MPXV) cases
  diagnosed and monitored at the National Institute for Infectious Diseases “Lazzaro
  Spallanzani” (INMI) in Rome, Italy, during May–June 2022. Longitudinal non-lesion
  specimens (oropharyngeal swab/OPS, saliva, plasma, urine, stool, semen) were tested
  for MPXV DNA using rtPCR (Ct values; target CrmB gene, Ct>40 negative), with quantification
  on a subset by droplet digital PCR (ddPCR) and infectivity assessed by viral culture
  on Vero E6 cells. CSV figure-derived data here provide per-patient time series of
  Ct values and MPXV DNA concentration normalized to extracted nucleic acid (gc/ng)
  at specific days post symptom onset.
analytes:
  urine_ct:
    description: MPXV DNA detection by real-time PCR (rtPCR) targeting the CrmB gene
      (Li et al. 2010 assay); Ct>40 considered negative. Ct values used as surrogate
      of viral DNA load. Measurements are days since symptom onset.
    specimen: urine
    biomarker: mpox
    gene_target: CrmB
    limit_of_detection: 40
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
  semen_ct:
    description: MPXV DNA detection by real-time PCR (rtPCR) targeting the CrmB gene
