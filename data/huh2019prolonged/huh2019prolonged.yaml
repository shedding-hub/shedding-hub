title: Prolonged shedding of type 55 human adenovirus in immunocompetent adults with
  adenoviral respiratory infections
doi: 10.1007/s10096-019-03471-9
description: Prospective study of immunocompetent adults with respiratory infection
  confirmed as human adenovirus type 55 (HAdV-55) during an outbreak. Consecutive
  respiratory specimens (sputum or nasopharyngeal swab) were collected every 2 days
  and adenovirus viral load was measured by real-time quantitative PCR (qPCR), reported
  as copies per mL relative to symptom onset.
analytes:
