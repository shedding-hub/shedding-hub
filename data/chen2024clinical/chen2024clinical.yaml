title: 'Clinical manifestations and viral kinetics of people with Mpox: A case series
  during the 2023 outbreak in Taiwan'
doi: 10.1016/j.jmii.2024.08.008
description: Case series from Taiwan (2023 mpox outbreak) reporting viral kinetics
  (PCR Ct values) across multiple specimen types (oropharyngeal/throat swab, vesicle
  swab, urethral swab, rectal swab) in mpox cases, including people with HIV and tecovirimat
  treatment. This extraction covers CSV batch 1/4 with repeated sampling per patient
  over days since a clinical reference timepoint (not specified in the provided excerpt).
curation:
  method: ai_assisted
  data_source:
    - main_text
    - table
    - supplement
  extracted_on: '2026-09-17'
analytes:
  oropharyngeal_swab:
    description: Mpox virus DNA detection by PCR reported as cycle threshold (Ct)
      value from oropharyngeal (throat) swab (CSV rows where specimen=throat swab).
      Assay details (platform/gene target) not provided in the excerpted data.
    specimen: oropharyngeal_swab
    biomarker: mpox
    gene_target: E9L
    limit_of_detection: 35
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
  vesicle_swab:
    description: Mpox virus DNA detection by PCR reported as cycle threshold (Ct)
      value from vesicle swab. Assay details (platform/gene target) not provided in
      the excerpted data.
    specimen: vesicle_swab
    biomarker: mpox
    gene_target: E9L
    limit_of_detection: 35
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
  urethra_swab:
    description: Mpox virus DNA detection by PCR reported as cycle threshold (Ct)
      value from urethral swab. Assay details (platform/gene target) not provided
      in the excerpted data.
    specimen: urethral_swab
    biomarker: mpox
    gene_target: E9L
    limit_of_detection: 35
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
  rectal_swab:
    description: Mpox virus DNA detection by PCR reported as cycle threshold (Ct)
      value from rectal swab. Assay details (platform/gene target) not provided in
      the excerpted data.
    specimen: rectal_swab
    biomarker: mpox
    gene_target: E9L
    limit_of_detection: 35
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
