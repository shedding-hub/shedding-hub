title: 'Monitoring monkeypox virus in saliva and air samples in Spain: a cross-sectional
  study'
doi: 10.1016/S2666-5247(22)00291-9
description: Cross-sectional study in Madrid, Spain (two health centres) during the
  2022 mpox outbreak. Symptomatic patients with PCR-confirmed mpox were sampled within
  the first week after symptom onset. Monkeypox virus DNA in saliva was measured by
  qPCR (Ct and genome copies per mL). Infectious virus was assessed by cell culture
  (BSC-1) in the parent study, but the provided figure-derived CSV contains saliva
  qPCR Ct and genome copies/mL values at a single timepoint per patient relative to
  symptom onset (days).
analytes:
  ct_saliva:
    description: Monkeypox virus (MPXV) DNA detection in saliva by quantitative PCR
      (qPCR). Samples run in triplicate; positivity defined in study as Ct<35 with
      at least 2/3 replicates positive. CSV provides mean Ct values per participant
      sample.
    specimen: saliva
    biomarker: mpox
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
  gc_ml_saliva:
    description: Monkeypox virus (MPXV) DNA concentration in saliva quantified by
      qPCR via Ct interpolation on a plasmid standard curve; reported as genome copies
      per mL of saliva (gc/mL).
    specimen: saliva
    biomarker: mpox
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: symptom onset
