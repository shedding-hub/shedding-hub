title: Shedding of pandemic (H1N1) 2009 virus among health care personnel, Seattle,
  Washington, USA
doi: 10.3201/eid1704.100866
description: Outbreak investigation of pandemic (H1N1) 2009 among hospital-associated
  retreat attendees in Seattle (September 2009). Sixteen health care personnel with
  laboratory-confirmed infection provided serial self-collected nasal wash specimens
  (every Mon/Wed/Fri) and symptom logs; specimens were tested by real-time RT-PCR
  (quantified as RNA copies/mL) and rapid culture. Study evaluated duration of viral
  RNA detection and culture positivity relative to symptom onset and fever, and found
  RT-PCR detection lasted longer (3–13 days) than culture (3–10 days). All infected
  HCP received oseltamivir early in illness.
analytes:
  nasal_lavage_influenza_gc_per_mL:
    description: Real-time RT-PCR quantification of influenza (pandemic H1N1 2009)
      viral RNA concentration measured in self-collected nasal wash (nasal lavage)
      specimens. Samples were also tested by rapid culture (culture not quantified).
      Real-time RT-PCR performed at the University of Washington Virology Laboratory;
      lower detection limit reported as 3 log10 copies/mL.
    specimen: nasal_lavage_fluid
    biomarker: influenza
    limit_of_detection: 1000
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: symptom onset
