title: 'Presymptomatic viral shedding in high-risk mpox contacts: A prospective cohort
  study'
doi: 10.1002/jmv.28769
description: Prospective cohort of 25 high-risk contacts of clade IIb monkeypox virus
  (MPXV) cases recruited in Antwerp, Belgium (June 24–July 31, 2022). Participants
  performed daily self-sampling (anorectal, genital, saliva) and attended weekly clinic
  visits (blood, oropharyngeal, etc.). Samples were tested by an in‑house MPXV PCR
  (targeting the MPXV-TNF receptor gene) on an Applied Biosystems QuantStudio. Study
  documents presymptomatic MPXV DNA detection (Ct values) and culture of replication-competent
  virus from presymptomatic anorectal samples.
analytes:
  serum:
    description: 'MPXV detected by in-house real-time PCR targeting the MPXV-TNF receptor
      gene run on an Applied Biosystems QuantStudio (cycle threshold values reported).
      Specimen: serum collected at clinic visits.'
    specimen: serum
    biomarker: mpox
    gene_target: MPXV-TNF receptor gene
    limit_of_detection: 37
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: exposure
  saliva:
    description: 'MPXV detected by in-house real-time PCR targeting the MPXV-TNF receptor
      gene run on an Applied Biosystems QuantStudio (cycle threshold values reported).
      Specimen: self-collected saliva.'
    specimen: saliva
    biomarker: mpox
    gene_target: MPXV-TNF receptor gene
    limit_of_detection: 37
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: exposure
  anorectal_swab:
    description: 'MPXV detected by in-house real-time PCR targeting the MPXV-TNF receptor
      gene run on an Applied Biosystems QuantStudio (cycle threshold values reported).
      Specimen: anorectal swab (self-collected).'
    specimen: anorectal_swab
    biomarker: mpox
    gene_target: MPXV-TNF receptor gene
    limit_of_detection: 37
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: exposure
  oropharyngeal_swab:
    description: 'MPXV detected by in-house real-time PCR targeting the MPXV-TNF receptor
      gene run on an Applied Biosystems QuantStudio (cycle threshold values reported).
      Specimen: oropharyngeal swab collected at clinic visits.'
    specimen: oropharyngeal_swab
    biomarker: mpox
    gene_target: MPXV-TNF receptor gene
    limit_of_detection: 37
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: exposure
  genital_swab:
    description: 'MPXV detected by in-house real-time PCR targeting the MPXV-TNF receptor
      gene run on an Applied Biosystems QuantStudio (cycle threshold values reported).
      Specimen: genital swab (skin swab from coronal sulcus for men or vaginal swab
      for women).'
    specimen: genital_swab
    biomarker: mpox
    gene_target: MPXV-TNF receptor gene
    limit_of_detection: 37
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: exposure
