title: 'Clinical Characterization and Outcomes of Human Clade IIb Mpox Virus Disease:
  A European Multicenter Mpox Observational Cohort Study (MOSAIC)'
doi: 10.1093/cid/ciae657
description: Multicenter observational cohort (MOSAIC) of laboratory-confirmed clade
  IIb mpox (MPXV) in 6 European countries (enrolled June 2022–July 2023). Participants
  were followed up to 6 months, with virologic monitoring by MPXV-specific real-time
  PCR (Ct values) on plasma, skin lesion swabs, oropharyngeal swabs, and anorectal
  swabs. PCR Ct≥40 was considered negative. CSV figure data provide individual longitudinal
  Ct measurements by patient and specimen; participants are categorized as treated
  vs untreated (systemic antivirals within 14 days of first PCR-positive sample) but
  no individual demographics are provided in the CSV.
curation:
  method: ai_assisted
  data_source:
    - main_text
    - figure
    - supplement
  extracted_on: '2026-09-17'
analytes:
  oropharyngeal_swab:
    description: MPXV-specific real-time PCR performed per local laboratory procedures;
      Ct value reported for oropharyngeal (throat) swab samples. Ct≥40 considered
      negative.
    specimen: oropharyngeal_swab
    biomarker: mpox
    limit_of_detection: 40
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
  anorectal_swab:
    description: MPXV-specific real-time PCR performed per local laboratory procedures;
      Ct value reported for anorectal swab samples. Ct≥40 considered negative.
    specimen: anorectal_swab
    biomarker: mpox
    limit_of_detection: 40
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
  skin:
    description: MPXV-specific real-time PCR performed per local laboratory procedures;
      Ct value reported for skin lesion swab samples (reported as 'skin' in CSV).
      Ct≥40 considered negative.
    specimen: skin_lesion
    biomarker: mpox
    limit_of_detection: 40
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
  plasma:
    description: MPXV-specific real-time PCR performed per local laboratory procedures;
      Ct value reported for plasma samples. Ct≥40 considered negative.
    specimen: plasma
    biomarker: mpox
    limit_of_detection: 40
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
