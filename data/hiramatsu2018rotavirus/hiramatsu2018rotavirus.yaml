title: Rotavirus Vaccination Can Be Performed Without Viral Dissemination in the Neonatal
  Intensive Care Unit
doi: 10.1093/infdis/jix590
description: Prospective NICU study (Oct 2014–Dec 2015) assessing fecal shedding and
  dissemination of rotavirus vaccine strains after oral vaccination with RotaTeq (RV5)
  or Rotarix (RV1). Nineteen vaccinated infants (9 RV5, 10 RV1) and 49 nearby unvaccinated
  infants were enrolled; stool (and some rectal swab) samples were serially collected
  and tested by vaccine-strain specific real-time RT-PCR. Vaccine-strain shedding
  was detected in all vaccinated infants but no vaccine genomes were detected in any
  samples from unvaccinated infants. The provided CSV contains cycle-threshold (Ct)
  time-series (days after vaccination) extracted from Figure 2 for RV5-vaccinated
  infants.
