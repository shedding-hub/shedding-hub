title: 'Mpox Virus in the Pharynx of Men Having Sex with Men: A Case Series'
doi: 10.3390/pathogens13010092
description: Case series of mpox patients diagnosed at an urban STD/STI center in
  Lombardy (Northern Italy) between May and August 2022. Skin lesion swabs and oropharyngeal
  (pharynx/throat) swabs were collected at baseline and then (for those enrolled after
  July 2022) followed weekly until negative. MPV DNA detection was performed using
  the RealStar Orthopoxvirus PCR Kit 1.0, reporting Ct values. Longitudinal follow-up
  data are available for 11 men who have sex with men (MSM).
analytes:
  pharynx:
    description: Mpox virus DNA detected in oropharyngeal (pharynx/throat) swabs using
      RealStar Orthopoxvirus PCR Kit 1.0 (Altona Diagnostics); result recorded as
      PCR cycle threshold (Ct) when positive; negatives recorded as not detected.
    specimen: oropharyngeal_swab
    biomarker: mpox
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: enrollment
