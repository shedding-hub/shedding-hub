title: 'Viral dynamics in transplant patients: implications for disease'
doi: 10.1016/S1473-3099(07)70159-7
description: Review article summarizing viral load kinetics for multiple viruses relevant
  to transplantation (e.g., CMV, EBV, HHV-6/7, HCV, adenovirus, BK polyomavirus). CSV
  figure data provide a single transplant patient's longitudinal BK polyomavirus (BKV)
  plasma viral load series, with mixed qualitative and quantitative results, timed
  relative to transplantation (treatment).
