title: Prolonged viral shedding in an immunocompromised Korean patient infected with
  hMPXV, sub-lineage B.1.3, with acquired drug resistant mutations during tecovirimat
  treatment
doi: 10.1002/jmv.29536
description: Case report from South Korea describing prolonged mpox (hMPXV) shedding
  in a 39-year-old male immunocompromised patient during tecovirimat treatment, with
  sequencing evidence of tecovirimat-associated resistance mutations (e.g., A290V,
  A288P) detected in different anatomical lesion/nasal samples over time.
