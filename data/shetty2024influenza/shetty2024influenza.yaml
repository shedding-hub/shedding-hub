title: Influenza virus infection and aerosol shedding kinetics in a controlled human
  infection model
doi: 10.1128/jvi.01612-24
description: Controlled human infection study (Emory University Hospital, July–September
  2022) in which eight adults were intranasally inoculated with influenza A/Perth/16/2009
  (H3N2). Viral shedding was measured in nasopharyngeal swabs, saliva, nasal lavage
  fluid, stool, urine, exhaled breath aerosols, and environmental surface swabs. Six
  of eight participants became PCR-positive; infectious virus was measured by plaque
  assay (MDCK cells) in NP swabs, saliva, and nasal lavage fluid. Respiratory particle
  emissions were sampled during breathing and speaking and analyzed by ddPCR for viral
  RNA. Clinical symptom scores and serology (HAI, MN) were also collected.
analytes:
  nasopharyngeal_swab_ct:
    description: Cycle threshold (Ct) values from clinical PCR testing of nasopharyngeal
      swabs (Xpert Xpress CoV-2/Flu/RSV plus assay; two influenza primer sets). Ct
      values were obtained from the clinical laboratory.
    specimen: nasopharyngeal_swab
    biomarker: influenza
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: inoculation
  nasopharyngeal_swab_pfu_ml:
    description: Infectious virus titer measured by plaque assay on MDCK cells from
      nasopharyngeal swab specimens (plaque forming units per milliliter).
    specimen: nasopharyngeal_swab
    biomarker: influenza
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: pfu/mL
    reference_event: inoculation
  saliva_pfu_ml:
    description: Infectious virus titer measured by plaque assay on MDCK cells from
      saliva specimens (plaque forming units per milliliter).
    specimen: saliva
    biomarker: influenza
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: pfu/mL
    reference_event: inoculation
  nasal_lavage_fluid_pfu_ml:
    description: Infectious virus titer measured by plaque assay on MDCK cells from
      nasal lavage fluid specimens (plaque forming units per milliliter).
    specimen: nasal_lavage_fluid
    biomarker: influenza
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: pfu/mL
    reference_event: inoculation
