title: Clinical presentation, viral kinetics, and management of human monkeypox cases
  from New Delhi, India 2022
doi: 10.1002/jmv.28249
description: Case series of five confirmed mpox (MPXV) cases from New Delhi, India
  (2022) without international travel history, describing clinical presentation and
  viral kinetics with serial sampling across multiple specimen types. This extraction
  contains Ct (cycle threshold) measurements from figure-derived CSV for two patients
  (PatientID 01 and 02) across oropharyngeal swab, nasopharyngeal swab, serum, urine,
  and lesion specimens at specific post-onset days.
curation:
  method: ai_assisted
  data_source:
    - main_text
    - table
    - figure
  extracted_on: '2026-09-17'
analytes:
  ct_oropharyngeal_swab:
    description: MPXV DNA detection by real-time PCR reported as cycle threshold (Ct)
      values in oropharyngeal swab (OPS) specimens; time is post-onset day (POD) of
      illness.
    specimen: oropharyngeal_swab
    biomarker: mpox
    gene_target: B6R
    limit_of_detection: 40
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
  ct_nasopharyngeal_swab:
    description: MPXV DNA detection by real-time PCR reported as cycle threshold (Ct)
      values in nasopharyngeal swab (NPS) specimens; time is post-onset day (POD)
