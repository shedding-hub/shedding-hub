title: Molecular epidemiology of human metapneumovirus in Ireland
doi: 10.1002/jmv.21081
description: Pediatric respiratory specimens collected in Ireland were screened for
  human metapneumovirus (hMPV). An indirect immunofluorescence assay was validated
  against a quantitative real-time RT-PCR assay, and viral loads (copies/mL) were
  quantified for 30 hMPV-positive respiratory specimens; genotypes included A2a, A2b,
  and B2 subclusters (B2a, B2b).
analytes:
  respiratory_metapneumovirus_viral_load:
    description: Quantitative real-time reverse-transcriptase PCR (real-time RT-PCR)
      assay used to detect and quantify human metapneumovirus (hMPV) in pediatric
      respiratory specimens; values reported as copies/mL (quantitative determinations).
      Indirect immunofluorescence (IF) was also used for screening/validation, but
      the extracted measurements are RT-PCR viral loads.
    specimen: nasopharyngeal_aspirate
    biomarker: metapneumovirus
    gene_target: N
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: confirmation date
