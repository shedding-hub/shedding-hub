title: Diagnostic performance of a field-deployable iiPCR platform and viral load
  dynamics of MPXV Clade IIb in a cohort with high prevalence of HIV
doi: 10.1080/07853890.2026.2705009
description: Prospective single-center study (Kaohsiung Medical University Hospital,
  Taiwan) enrolling 24 qPCR-confirmed mpox (MPXV Clade IIb) patients (2023–2024) to
  evaluate the POCKIT Central MPXV iiPCR platform versus reference qPCR and to describe
  MPXV viral load dynamics by specimen type using qPCR Ct values relative to days
  post-symptom onset. Specimens included lesion-derived materials (pus, vesicular
  fluid, skin/oral swabs), nasopharyngeal swabs, urine, and plasma. qPCR targeted
  the MPXV G2R (TNF receptor) gene; iiPCR used manufacturer reagents on an automated
  sample-to-answer platform. CSV-provided data contain per-patient, per-day qPCR Ct
  measurements (including negatives) for multiple specimen types timed by days post-symptom
  onset.
analytes:
  pus:
    description: MPXV qPCR cycle threshold (Ct) values measured from lesion-derived
      pus specimens; qPCR performed after nucleic acid extraction (QIAamp MinElute
      Virus Spin Kit) using a real-time PCR assay targeting MPXV G2R (TNF receptor
      gene) on an Mx3000P instrument. Time is reported as days post-symptom onset.
    specimen: skin_lesion
    biomarker: mpox
    gene_target: G2R (TNF receptor gene)
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
