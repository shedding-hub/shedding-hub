title: Adenovirus infection and treatment with cidofovir in children after liver transplantation
doi: 10.1111/j.1399-3046.2008.01014.x
description: Retrospective study of pediatric liver transplant recipients monitored
  for adenovirus (ADV) DNAemia by quantitative real-time PCR in serum up to 24 weeks
  after transplant. The provided CSV contains longitudinal serum ADV PCR results (negative/quantified)
  at specified days post-transplant for 15 individual patients, with some patients
  symptomatic and with reported ADV genotypes for a subset (e.g., HAdV-C2, HAdV-C6).
  The original paper lists patient 9's adenovirus type as "A41", which is a typo --
  there is no adenovirus type A41. It is unclear whether the intended type was F41 or
  A31, so genotype is marked unknown rather than guessing.
analytes:
  serum_adenovirus_viral_load:
    description: Quantitative real-time PCR (qPCR) measurement of adenovirus (ADV)
      DNA in serum from pediatric liver transplant recipients, reported as copies
      per mL serum.
    specimen: serum
    biomarker: adenovirus
    limit_of_detection: 100
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: treatment
