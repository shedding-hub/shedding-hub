title: Adenovirus infections in immunocompetent and immunocompromised patients
doi: 10.1128/CMR.00116-13
description: Review article summarizing human adenovirus (HAdV) infections in immunocompetent
  and immunocompromised patients, including diagnostic and treatment considerations.
  The provided extracted numeric data (CSV) contain longitudinal adenovirus measurements
  in plasma over time for a single PatientID, stratified by adenovirus species/genogroup
  (AdV E, AdV F, AdV B).
