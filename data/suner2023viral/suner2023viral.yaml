title: 'Viral dynamics in patients with monkeypox infection: a prospective cohort
  study in Spain'
doi: 10.1016/S1473-3099(22)00794-0
description: Observational, prospective multicentre cohort study of outpatients with
  confirmed mpox (2022 clade IIb outbreak) in Spain (two hospitals and two sexual
  health clinics; June 28 to Sept 22, 2022). Participants self-collected longitudinal
  specimens from multiple body sites; MPXV DNA quantified by qPCR (copies per mL).
  Figure-derived CSV provides individual longitudinal viral loads (gene copies/mL)
  aligned to days from symptom onset for blood, pharynx (oropharyngeal swab in VTM),
  rectum (rectal swab in VTM), semen, and lesion swabs/scrapings (in VTM).
curation:
  method: ai_assisted
  data_source:
    - main_text
    - figure
    - supplement
  extracted_on: '2026-09-17'
analytes:
  blood:
    description: Mpox virus (MPXV) DNA quantification by qPCR on dried blood spot-derived
      blood specimen; viral load expressed as DNA copies per mL. Copy number determined
      using a linear dilution series of quantified MPXV DNA standard (AMPLIRUN Monkeypox
      virus DNA control, Vircell). Limit of detection stated as 4.0 log10 copies/mL
      for blood in figure legend (model used 4.04 log10 copies/mL).
    specimen: blood
    biomarker: mpox
    limit_of_detection: 10000
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: symptom onset
  pharynx:
    description: Mpox virus (MPXV) DNA quantification by qPCR from oropharyngeal (pharynx)
      swab placed in 3 mL viral transport medium; viral load expressed as copies per
      mL of viral transport medium, using quantified MPXV DNA standard (AMPLIRUN).
      Limit of detection for non-blood samples stated as 2.9 log10 copies/mL.
    specimen: oropharyngeal_swab
    biomarker: mpox
    limit_of_detection: 794.3282347
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: symptom onset
  rectum:
    description: Mpox virus (MPXV) DNA quantification by qPCR from rectal swab placed
      in 3 mL viral transport medium; viral load expressed as copies per mL of viral
      transport medium, using quantified MPXV DNA standard (AMPLIRUN). Limit of detection
      for non-blood samples stated as 2.9 log10 copies/mL.
    specimen: rectal_swab
    biomarker: mpox
    limit_of_detection: 794.3282347
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: symptom onset
  semen:
    description: Mpox virus (MPXV) DNA quantification by qPCR from semen specimen;
      viral load expressed as DNA copies per mL using quantified MPXV DNA standard
      (AMPLIRUN). Limit of detection for non-blood samples stated as 2.9 log10 copies/mL.
    specimen: semen
    biomarker: mpox
    limit_of_detection: 794.3282347
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: symptom onset
  lesion:
    description: Mpox virus (MPXV) DNA quantification by qPCR from skin lesion material
      (vesicle fluid or dry scraping of scabs/scars) collected with swab and placed
      in 3 mL viral transport medium; viral load expressed as copies per mL of viral
      transport medium using quantified MPXV DNA standard (AMPLIRUN). Limit of detection
      for non-blood samples stated as 2.9 log10 copies/mL.
    specimen: skin_lesion
    biomarker: mpox
    limit_of_detection: 794.3282347
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: symptom onset
