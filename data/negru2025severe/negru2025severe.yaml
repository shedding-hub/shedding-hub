title: A Severe Form of Mpox Infection and the Current Epidemiological Status in Romania
doi: 10.3390/microorganisms13081814
description: Retrospective descriptive study of mpox epidemiology in Romania (national
  surveillance in 2022–2023; 47 confirmed cases in 2022) plus a detailed severe-case
  longitudinal shedding description from one immunocompromised male patient with AIDS
  treated with tecovirimat. Monkeypox virus (MPXV) was detected by qPCR (genesig Advanced
  kit) from multiple specimen types collected serially over ~5 months; the figure-derived
  CSV provides Ct values over time for serum, skin lesion, saliva, urine, rectal swab,
  nasal, and pharyngeal specimens for PatientID 1.
curation:
  method: ai_assisted
  data_source:
    - main_text
    - figure
  extracted_on: '2026-09-17'
analytes:
  serum:
    description: MPXV genome detection by qPCR using monkeypox virus genesig Advanced
      Kit (Primerdesign, UK) on nucleic acid extracted (QIAamp DSP Virus Kit) from
      clinical samples collected in viral transport medium (VTM) and run on a Bio-Rad
      CFX96; CSV values are Ct (cycle threshold) over time.
    specimen: serum
    biomarker: mpox
    limit_of_detection: 40.2
    limit_of_quantification: unknown
    unit: cycle threshold
