title: Human bocavirus infection in children with respiratory tract disease
doi: 10.1097/INF.0b013e31817acfaa
description: Prospective 1-year study of children <5 years old hospitalized with respiratory
  tract disease, with asymptomatic controls, evaluating incidence and clinical features
  of human bocavirus (HBoV). Nasopharyngeal secretions were tested for HBoV; viral
  load was compared between monoinfections and coinfections, and persistence with
  subsequent detections was noted in a subset. This extraction contains patient-level
  longitudinal HBoV viral load measurements from a figure-derived CSV.
analytes:
  nasopharyngeal_secretions_bocavirus_viral_load:
    description: Human bocavirus (HBoV) viral load measured in nasopharyngeal secretions
      (assay/method details not provided in the supplied text/CSV). Values provided
      as quantitative viral load; negative indicates not detected.
    specimen: nasopharyngeal_aspirate
    biomarker: bocavirus
    gene_target: NP-1
    limit_of_detection: 10
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: enrollment
