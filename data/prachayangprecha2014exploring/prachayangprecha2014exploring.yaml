title: Exploring the Potential of Next-Generation Sequencing in Detection of Respiratory
  Viruses
doi: 10.1128/JCM.01641-14
description: Evaluation study of a sequence-independent next-generation sequencing
  approach versus routine diagnostic real-time RT-PCR for detecting respiratory viruses
  in nasopharyngeal aspirates from 81 Thai children with respiratory disease. Figure-derived
  CSV data provide per-patient real-time RT-PCR cycle threshold (Ct) values at a single
  timepoint (time=0; reference event not specified in the provided excerpt) for rhinovirus,
  enterovirus, human metapneumovirus, and bocavirus.
analytes:
  rhinovirus_ct:
    description: Real-time RT-PCR cycle threshold (Ct) measurement for rhinovirus
      from nasopharyngeal aspirate (figure-derived CSV). Assay gene target not specified
      in provided data excerpt.
    specimen: nasopharyngeal_aspirate
    biomarker: rhinovirus
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: confirmation date
  enterovirus_ct:
    description: Real-time RT-PCR cycle threshold (Ct) measurement for enterovirus
      from nasopharyngeal aspirate (figure-derived CSV). Assay gene target not specified
      in provided data excerpt.
    specimen: nasopharyngeal_aspirate
    biomarker: enterovirus
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: confirmation date
  metapneumovirus_ct:
    description: Real-time RT-PCR cycle threshold (Ct) measurement for human metapneumovirus
      from nasopharyngeal aspirate (figure-derived CSV). Assay gene target not specified
      in provided data excerpt.
    specimen: nasopharyngeal_aspirate
    biomarker: metapneumovirus
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: confirmation date
  bocavirus_ct:
    description: Real-time RT-PCR cycle threshold (Ct) measurement for bocavirus from
