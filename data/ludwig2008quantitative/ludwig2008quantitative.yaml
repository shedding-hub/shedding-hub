title: Quantitative detection of norovirus excretion in pediatric patients with cancer
  and prolonged gastroenteritis and shedding of norovirus
doi: 10.1002/jmv.21217
description: Retrospective study of nine pediatric patients with hematologic/oncologic
  disorders and prolonged gastroenteritis, assessing prolonged fecal norovirus shedding
  measured by one-step real-time PCR and correlating quantitative shedding with clinical
  symptoms. Measurements are reported as fecal norovirus concentrations over time
  (days after symptom onset).
analytes:
  stool_norovirus_viral_load:
    description: Quantitative norovirus detection/excretion measured in fecal samples
      using a one-step real-time PCR assay (as described in the abstract). CSV provides
      per-patient longitudinal quantitative values over days after symptom onset.
    specimen: stool
    biomarker: norovirus
    genogroup: GII
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: gc/wet gram
    reference_event: symptom onset
