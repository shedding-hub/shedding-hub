title: Tecovirimat Resistance in an Immunocompromised Patient With Mpox and Prolonged
  Viral Shedding
doi: 10.7326/L23-0131
description: Letter reporting longitudinal PCR measurements in one immunocompromised
  adult patient with mpox receiving tecovirimat, including MPXV Ct values from an
  anal lesion and plasma over time, and plasma HIV viral load (gc/mL). Times are provided
  as day offsets relative to an unspecified reference event in the CSV.
curation:
  method: ai_assisted
  data_source:
    - main_text
    - figure
  extracted_on: '2026-09-17'
analytes:
  anal_lesion_mpxv_ct:
    description: MPXV PCR cycle threshold (Ct) measured from anal lesion specimen
      (as labeled in the figure-data CSV). Assay platform/gene target not provided
      in supplied content.
    specimen: genital_or_rectal_lesion
    biomarker: mpox
    limit_of_detection: 45
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: treatment
  plasma_mpxv_ct:
    description: MPXV PCR cycle threshold (Ct) measured in plasma (as labeled in the
      figure-data CSV). Assay platform/gene target not provided in supplied content.
    specimen: plasma
    biomarker: mpox
    limit_of_detection: 45
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: treatment
  plasma_hiv_gc_ml:
    description: HIV viral load quantified in plasma in gene copies per mL (gc/mL),
      as provided in the figure-data CSV. Assay details not provided in supplied content.
    specimen: plasma
    biomarker: HIV
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: treatment
