title: 'Prospective study of human metapneumovirus infection: diagnosis, typing and
  virus quantification in nasopharyngeal secretions from pediatric patients'
doi: 10.1016/j.jcv.2007.08.001
description: Prospective evaluation (winter-spring 2004-2005 and 2005-2006) of human
  metapneumovirus (hMPV) detection/typing in pediatric patients using monoclonal antibodies
  and RT-PCR, with viral load quantification in nasopharyngeal secretions. CSV-extracted
  figure data provide per-patient day-0 and follow-up measurements (relative to symptom
  onset) for metapneumovirus and some co-detected respiratory viruses (rhinovirus,
  influenza, coronavirus).
analytes:
  metapneumovirus:
    description: Quantification of human metapneumovirus (hMPV) RNA in nasopharyngeal
      secretions by RT-PCR (exact assay details not available in provided text; values
      provided as viral load).
    specimen: nasopharyngeal_aspirate
    biomarker: metapneumovirus
    limit_of_detection: 1000
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: hospital admission
  rhinovirus:
    description: Detection/quantification of rhinovirus RNA in nasopharyngeal secretions
      by RT-PCR (exact assay details not available in provided text; values provided
      as viral load).
    specimen: nasopharyngeal_aspirate
    biomarker: rhinovirus
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: hospital admission
  influenza:
    description: Detection/quantification of influenza virus in nasopharyngeal secretions
      by RT-PCR (exact assay details not available in provided text; value reported
      as negative in CSV).
    specimen: nasopharyngeal_aspirate
    biomarker: influenza
    limit_of_detection: unknown
    limit_of_quantification: 1000
    unit: gc/mL
    reference_event: hospital admission
  hCoV_63:
    description: Detection/quantification of hCoV NL63 in nasopharyngeal secretions
      by RT-PCR (exact assay details not available in provided text; value reported
      as negative in CSV).
    specimen: nasopharyngeal_aspirate
    biomarker: hCoV NL63 
    limit_of_detection: unknown
    limit_of_quantification: 1000
    unit: gc/mL
    reference_event: hospital admission
