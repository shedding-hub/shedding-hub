title: Association between adverse clinical outcome in human disease caused by novel
  influenza A H7N9 virus and sustained viral shedding and emergence of antiviral resistance
doi: 10.1016/S0140-6736(13)61125-3
description: Study of 14 patients with novel influenza A H7N9 admitted to Shanghai
  Public Health Clinical Centre in April 2013. Viral RNA was quantified sequentially
  in throat (oropharyngeal) swabs, stool, serum, and urine; viral sequencing of neuraminidase
  (NA) was performed to assess emergence of resistance. Paper links reduction in viral
  load after antivirals with improved outcome and reports persistent high viral load
  and emergence of NA Arg292Lys resistance in some patients. The provided CSV contains
  69 measurements from patients with IDs 1, 2, and 3 across the four specimen types.
analytes:
  oropharyngeal_swab:
    description: Viral RNA quantified by real-time PCR from throat (oropharyngeal)
      swabs; reported as gene copies per swab.
    specimen: oropharyngeal_swab
    biomarker: influenza
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: gc/swab
    reference_event: symptom onset
  serum:
    description: Viral RNA quantified by real-time PCR from serum; reported as gene
      copies per mL.
    specimen: serum
    biomarker: influenza
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: symptom onset
  urine:
    description: Viral RNA quantified by real-time PCR from urine; reported as gene
      copies per mL.
    specimen: urine
    biomarker: influenza
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: symptom onset
  stool:
    description: Viral RNA quantified by real-time PCR from stool specimens; reported
      as gene copies per wet gram.
    specimen: stool
    biomarker: influenza
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: gc/wet gram
    reference_event: symptom onset
