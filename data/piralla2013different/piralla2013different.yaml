title: Different drug-resistant influenza A(H3N2) variants in two immunocompromised
  patients treated with oseltamivir during the 2011–2012 influenza season in Italy
doi: 10.1016/j.jcv.2013.06.003
description: Hospital-based study in Italy during the 2011–2012 influenza season assessing
  influenza A(H3N2) viral kinetics and emergence of oseltamivir resistance. Sequential
  respiratory samples were analyzed from treated and untreated patients; neuraminidase
  (NA) sequencing and clonal analysis were performed in patients unresponsive to oseltamivir,
  identifying resistant mutations including R292K, E119V, N294S, and Del247–250. Figure-derived
  quantitative viral load time series are available for multiple patients by immune
  status and treatment, and Table 1 reports clonal proportions of NA mutations over
  time for two immunocompromised oseltamivir-unresponsive patients (Pavia/14 and Pavia/27).
analytes:
  nasopharyngeal_swab:
    description: Quantitative influenza A(H3N2) viral load time series from nasal/nasopharyngeal
      swabs (NS) as digitized from Fig. 1; values provided as gene-copy concentration
      (exact PCR target/assay details not provided in the supplied text/CSV). Time
      is relative to the figure's reference (not specified in the provided excerpt;
      CSV provides day values directly).
    specimen: nasopharyngeal_swab
    biomarker: influenza
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: confirmation date
  bronchoalveolar_lavage_fluid:
    description: Quantitative influenza A(H3N2) viral load time series from bronchoalveolar
      lavage (BAL) as digitized from Fig. 1; values provided as gene-copy concentration
      (exact PCR target/assay details not provided in the supplied text/CSV). Time
      is relative to the figure's reference (not specified in the provided excerpt;
      CSV provides day values directly).
    specimen: bronchoalveolar_lavage_fluid
    biomarker: influenza
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: confirmation date
