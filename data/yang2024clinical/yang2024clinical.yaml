title: 'Clinical features and viral load variations of Mpox: a retrospective study
  in Chongqing, China'
doi: 10.1186/s12879-024-09537-0
description: Retrospective case series of nine PCR-confirmed mpox (MPXV) infections
  among MSM men admitted to Chongqing Public Health Medical Center (Chongqing, China)
  from September 2022 to October 2023. MPXV DNA was detected by qPCR (DAAN Gene kit
  on Bio-Rad CFX96 after EXM6000 magnetic-bead extraction) and results were reported
  as Ct values across multiple specimen types (skin lesions, oropharyngeal swab, nasopharyngeal
  swab, anus swab, and feces/stool). CSV figure-derived Ct time series were provided
  and extracted (70 rows total), with time in days relative to symptom onset.
analytes:
  nasopharyngeal_swab:
    description: MPXV DNA detection by quantitative real-time PCR (qPCR) reported
      as Ct values from nasopharyngeal swab specimens; DNA extracted using EXM6000
      magnetic bead method; PCR on Bio-Rad CFX96 using DAAN Gene MPXV nucleic acid
      testing kit.
    specimen: nasopharyngeal_swab
    biomarker: mpox
    limit_of_detection: 40
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
  skin:
    description: MPXV DNA detection by quantitative real-time PCR (qPCR) reported
      as Ct values from skin lesion specimens; DNA extracted using EXM6000 magnetic
      bead method; PCR on Bio-Rad CFX96 using DAAN Gene MPXV nucleic acid testing
      kit.
    specimen: skin_lesion
    biomarker: mpox
    limit_of_detection: 40
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
  stool:
    description: MPXV DNA detection by quantitative real-time PCR (qPCR) reported
      as Ct values from feces/stool specimens; DNA extracted using EXM6000 magnetic
      bead method; PCR on Bio-Rad CFX96 using DAAN Gene MPXV nucleic acid testing
      kit.
    specimen: stool
    biomarker: mpox
    limit_of_detection: 40
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
  anus:
    description: MPXV DNA detection by quantitative real-time PCR (qPCR) reported
      as Ct values from anus (anorectal) swab specimens; DNA extracted using EXM6000
      magnetic bead method; PCR on Bio-Rad CFX96 using DAAN Gene MPXV nucleic acid
      testing kit.
    specimen: anorectal_swab
    biomarker: mpox
    limit_of_detection: 40
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
  oropharyngeal_swab:
    description: MPXV DNA detection by quantitative real-time PCR (qPCR) reported
      as Ct values from oropharyngeal (throat) swab specimens; DNA extracted using
      EXM6000 magnetic bead method; PCR on Bio-Rad CFX96 using DAAN Gene MPXV nucleic
      acid testing kit.
    specimen: oropharyngeal_swab
    biomarker: mpox
    limit_of_detection: 40
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
