title: Small quantities of respiratory syncytial virus RNA only in large droplets
  around infants hospitalized with acute respiratory infections
doi: 10.1186/s13756-021-00968-x
description: Hospital-based observational study in Delft, The Netherlands (Nov 2017–Apr
  2020) of 6 hospitalized infants (0–2 years) with laboratory-confirmed RSV-B infection
  (two with rhinovirus co-infection). Longitudinal RSV (and RV where applicable) RNA
  detection was performed by qRT-PCR (Ct values; Ct>40 negative) on nasopharyngeal
  aspirates from infants and nose/throat swabs from parents; air sampling around infants
  used a six-stage Andersen cascade impactor with subsequent qRT-PCR, and infectious
  RSV was assessed by culture (TCID50) on HEp-2 cells (not extracted here because
  no individual-level TCID50 values were provided in the supplied CSV/table extraction).
  Times in the provided figure-derived CSV are treated as days relative to symptom
  onset (reference event).
analytes:
  rsv_nasopharyngeal_aspirate_ct:
    description: RSV-B RNA detection in infant nasopharyngeal aspirates by qRT-PCR
      (MagNA Pure LC extraction; TaqMan Fast Virus 1-Step Master Mix). Ct>40 considered
      negative.
    specimen: nasopharyngeal_aspirate
    biomarker: RSV
    limit_of_detection: 40
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
  rsv_oropharyngeal_swab_nasopharyngeal_swab_ct:
    description: RSV-B RNA detection in parent nose/throat swabs (oropharyngeal and/or
      nasopharyngeal swab per figure CSV labeling) by qRT-PCR; Ct>40 considered negative.
    specimen:
    - oropharyngeal_swab
    - nasopharyngeal_swab
    biomarker: RSV
    limit_of_detection: 40
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
  rv_nasopharyngeal_aspirate_ct:
    description: Rhinovirus (RV) RNA detection in infant nasopharyngeal aspirates
      by qRT-PCR (performed for RV co-infected infants); Ct>40 considered negative.
    specimen: nasopharyngeal_aspirate
    biomarker: rhinovirus
    limit_of_detection: 40
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
