title: Laboratory validation and clinical performance of a saliva-based test for monkeypox
  virus
doi: 10.1002/jmv.28191
description: Study reporting laboratory validation and clinical implementation of
  a saliva-based real-time PCR assay for mpox (monkeypox virus) in California (Los
  Angeles, San Francisco, Palm Springs). The paper reports analytic sensitivity (limit
  of detection 250 copies/mL) and clinical performance, including saliva Ct values
  for 22 saliva-positive cases timed relative to symptom onset (Table 2) and paired
  saliva/skin lesion PCR results timed relative to confirmation date (Table 3).
curation:
  method: ai_assisted
  data_source:
    - main_text
    - table
  extracted_on: '2026-09-17'
analytes:
  saliva_symptom_onset:
    description: Saliva-based TaqMan real-time PCR assay targeting the mpox virus
      J1L region; Ct values reported for clinical cases, with time referenced to symptom
      onset (days between symptom onset and positive saliva test). Samples run in
      triplicate; positives with Ct >=34 repeated for confirmation. Internal control
      RNase P used.
    specimen: saliva
    biomarker: mpox
    gene_target: J1L
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
  saliva_confirmation_date:
    description: Saliva PCR Ct values for mpox reported for patients with paired saliva/lesion
      testing; time referenced to confirmation date (time=0 at confirmation date,
      per CSV). Assay described as saliva-based TaqMan real-time PCR targeting mpox
      J1L with RNase P internal control; triplicate wells per sample; Ct values reported
      when available.
    specimen: saliva
    biomarker: mpox
    gene_target: J1L
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: confirmation date
  skin_lesion_confirmation_date:
    description: Skin lesion (lesion swab) PCR results for mpox from paired testing;
      time referenced to confirmation date (days between saliva test and lesion test
      reported). Lesion testing performed as Monkeypox (Orthopox) DNA PCR test (Labcorp);
      Ct values available only for Los Angeles patients, while other sites may provide
      qualitative positive/negative.
    specimen: skin_lesion
    biomarker: mpox
    gene_target: J1L
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: confirmation date
