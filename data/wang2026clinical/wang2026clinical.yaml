title: 'Clinical and radiological features of severe mpox: a case series of 16 patients
  in Beijing, China'
doi: 10.1186/s12879-026-12626-x
description: Single-center retrospective case series from Beijing Youan Hospital (Beijing,
  China) including 16 patients with severe mpox and HIV co-infection diagnosed between
  June 2023 and June 2024. Mpox was confirmed by real-time PCR for MPXV (Ct<40) with
  vesicular fluid swabs as the primary sample type. Figure-derived CSV provides MPXV
  PCR Ct values from vesicular fluid at time 0 (reference event not specified in CSV/figure
  extract; all participants marked symptomatic).
curation:
  method: ai_assisted
  data_source:
    - main_text
    - supplement
  extracted_on: '2026-09-17'
analytes:
  vesicular_fluid:
    description: Real-time PCR (qPCR) for MPXV confirmation (Ct threshold for positivity
      reported as Ct<40); vesicular fluid swabs were the primary sample type. CSV
      provides Ct values from vesicular fluid at time 0.
    specimen: vesicle_swab
    biomarker: mpox
    limit_of_detection: 40
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: confirmation date
