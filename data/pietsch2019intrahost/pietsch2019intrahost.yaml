title: Intrahost viral evolution during chronic sapovirus infections
doi: 10.1016/j.jcv.2019.02.001
description: Hospital-based study (January 2010 to September 2018) analyzing stool
  samples from in-patients for sapovirus RNA by real-time RT-PCR, with sequencing/phylogenetic
  genotyping in chronic diarrhea cases to investigate intrahost evolution during chronic
  sapovirus infection in immunocompromised individuals. CSV-provided participant-level
  longitudinal stool RT-PCR measurements are reported as cycle threshold values over
  time (days) relative to symptom onset.
analytes:
  stool_sapovirus_ct:
    description: Sapovirus RNA detection in stool by real-time RT-PCR; values are
      reported as PCR cycle threshold (Ct). Genotyping (GI.2, GII.1, GII.3) was assessed
      by phylogenetic analysis of the capsid gene (VP1) in chronic cases (used here
      as participant genotype attribute, not assay target).
    specimen: stool
    biomarker: sapovirus
    gene_target: ORF1/ORF2
    limit_of_detection: 40
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
