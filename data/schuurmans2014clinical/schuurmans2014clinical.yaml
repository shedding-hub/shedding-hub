title: 'Clinical features and outcomes of influenza infections in lung transplant
  recipients: a single-season cohort study'
doi: 10.1111/tid.12228
description: Retrospective single-season (2010/2011) cohort study of lung transplant
  recipients at Zurich University Hospital. Laboratory-confirmed influenza A or B
  infections (22 infections in 21 patients) were diagnosed by nasopharyngeal swab
  and real-time RT-PCR. Patients received empirical oseltamivir and serial weekly
  swabs were performed until virologic results were negative. Study reports Ct values
  from nasopharyngeal swabs (used here as cycle-threshold measurements relative to
  symptom onset). Prolonged viral shedding (>=7 days) was common.
analytes:
  nasopharyngeal_swab_influenza_CT:
    description: Real-time RT-PCR cycle threshold (Ct) values measured on nasopharyngeal
      swab specimens for detection of influenza virus (reported by the study as PCR
      Ct values from diagnostic qRT-PCR of nasopharyngeal swabs).
    specimen: nasopharyngeal_swab
    biomarker: influenza
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
