title: Sapovirus detection and quantification in fecal samples from allogeneic hematopoietic
  stem cell transplant recipients
doi: 10.1007/s13337-020-00583-1
description: Longitudinal retrospective monitoring study in Goiás, Brazil (fecal samples
  collected Oct 2012–Jul 2014) of 19 allogeneic hematopoietic stem cell transplant
  (allo-HSCT) recipients. Stool (fecal) specimens were processed as 20% suspensions
  in PBS and tested for sapovirus by RT-qPCR (TaqMan) using Oka et al. 2006 primers/probe
  targeting the polymerase/capsid junction; viral loads were quantified via standard
  curve from serial dilutions of a recombinant plasmid. One patient was sapovirus-positive
  with serial samples; one positive sample was sequenced (Sanger) and typed as GI.1.
analytes:
  stool_sapovirus_viral_load:
    description: Sapovirus RNA detection and quantification in stool using RT-qPCR
      (TaqMan) with primers SaV124F, SaV1F, SaV1245R and probe SaV124TP (per Oka et
      al., 2006), targeting the polymerase/capsid junction region; quantification
      by standard curve with serial dilutions of a recombinant plasmid containing
      the polymerase/capsid partial region.
    specimen: stool
    biomarker: sapovirus
    gene_target: ORF1
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: gc/wet gram
    reference_event: hospital admission
