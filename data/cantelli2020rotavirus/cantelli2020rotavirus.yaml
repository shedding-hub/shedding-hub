title: Rotavirus A shedding and HBGA host genetic susceptibility in a birth community-cohort,
  Rio de Janeiro, Brazil, 2014-2018
doi: 10.1038/s41598-020-64025-0
description: Prospective birth community-cohort study in Manguinhos, Rio de Janeiro,
  Brazil (2014–2018) following infants through <1 year of age who received Rotarix
  (RV1) oral rotavirus vaccine. Stool samples were collected and screened for rotavirus
  A shedding using RT-qPCR (Ct), with RV1 G1P[8] characterization and VP8* sequencing
  (including F167L mutation). This extraction captures individual Ct values and days
  post-vaccination (or pre-dose/non-vaccinated sampling) from the provided CSV/table
  for Le(a+b+) secretor children.
analytes:
  '1':
    description: Rotavirus A (vaccine-derived RV1 G1P[8]) RT-qPCR cycle threshold
      (Ct) values measured in stool samples collected after RV1 dose 1; positivity
      defined as Ct ≤ 40. Genotype/VP8* Sanger sequencing used to classify RV1 and
      F167L mutation status (reported separately in table/CSV as gene_type).
    specimen: stool
    biomarker: rotavirus vaccine
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: vaccination
    dose: 1
    vaccine_type: Rotarix (RV1)
  '2':
    description: Rotavirus A (vaccine-derived RV1 G1P[8]) RT-qPCR cycle threshold
      (Ct) values measured in stool samples collected after RV1 dose 2; positivity
      defined as Ct ≤ 40. Genotype/VP8* Sanger sequencing used to classify RV1 and
      F167L mutation status (reported separately in table/CSV as gene_type).
    specimen: stool
    biomarker: rotavirus vaccine
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: vaccination
    dose: 2
    vaccine_type: Rotarix (RV1)
