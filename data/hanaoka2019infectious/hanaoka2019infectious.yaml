title: Infectious human adenoviruses are shed in urine even after disappearance of
  urethral symptoms
doi: 10.1371/journal.pone.0212434
description: Comparative study in Japan (urology STI clinic, June 2014–May 2016) of
  male patients with acute urethritis and asymptomatic male volunteers. First-void
  urine (FVU) samples were screened for urethritis-related pathogens including human
  adenovirus (HAdV). HAdV DNA was detected by real-time and nested PCR and quantified
  by real-time PCR as copies/mL urine; infectious virus was assessed by culture isolation
  in A549 cells with confirmation by cytopathic effect and PCR. This extraction captures
  individual longitudinal urine HAdV DNA measurements (copies/mL) from a CSV derived
  from figures/tables, timed by days from symptom onset.
analytes:
  urine_adenovirus_viral_load:
    description: Quantification of human adenovirus (HAdV) DNA in first-void urine
      using real-time PCR (with HAdV detection also performed by real-time and nested
      PCR in the study). Values reported as copy number per mL urine (copies/mL).
      Virus isolation in A549 cells was also performed in the study but is not part
      of this numeric analyte.
    specimen: urine
    biomarker: adenovirus
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: symptom onset
