title: Similarities in rotavirus vaccine viral shedding and immune responses in pairs
  of twins
doi: 10.20407/fmj.2022-039
description: Prospective cohort study of 20 infants (four twin pairs and twelve singletons)
  admitted to the neonatal intensive care unit at Fujita Health University Hospital
  (Japan), born Nov 2018–Jun 2020, receiving two doses of Rotarix (RV1). Stool was
  collected daily from vaccination day (day 0) through day 8 after each dose to quantify
  fecal RV1 vaccine-strain shedding by RV1-specific qRT-PCR (reported here as gene
  copies per PCR reaction from figure-derived CSV).
analytes:
  1_gc_reaction:
    description: Fecal rotavirus vaccine strain (Rotarix/RV1) RNA shedding quantified
      by RV1-specific qRT-PCR from stool suspensions; values reported as gene copies
      per PCR reaction (gc/reaction) after dose 1.
    specimen: stool
    biomarker: rotavirus vaccine
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: gc/reaction
    reference_event: vaccination
    dose: 1
    vaccine_type: Rotarix (RV1)
  2_gc_reaction:
    description: Fecal rotavirus vaccine strain (Rotarix/RV1) RNA shedding quantified
      by RV1-specific qRT-PCR from stool suspensions; values reported as gene copies
      per PCR reaction (gc/reaction) after dose 2.
    specimen: stool
    biomarker: rotavirus vaccine
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: gc/reaction
    reference_event: vaccination
    dose: 2
    vaccine_type: Rotarix (RV1)
