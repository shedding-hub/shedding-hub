title: Frequent detection of monkeypox virus DNA in saliva, semen, and other clinical
  samples from 12 patients, Barcelona, Spain, May to June 2022
doi: 10.2807/1560-7917.ES.2022.27.28.2200503
description: Observational shedding study of 12 confirmed symptomatic mpox (monkeypox
  virus) patients in Barcelona, Spain (May–June 2022). Multiple specimen types (skin
  lesion swab, saliva, rectal swab, nasopharyngeal swab, semen, urine, and faeces/stool)
  were tested at diagnosis and follow-up time points using real-time PCR, reporting
  Ct (Cq) values (or negative/NA). Timing is reported as days since symptom onset.
curation:
  method: ai_assisted
  data_source:
    - main_text
    - table
  extracted_on: '2026-09-17'
analytes:
  ct_skin_lesion_swab:
    description: Monkeypox virus DNA detection by specific real-time PCR (qPCR) reported
      as quantification cycle (Cq/Ct). Clinical samples were inactivated 1:1 with
      cobas omni lysis reagent (Roche) prior to nucleic acid extraction (MagNA Pure
      Compact; MagNA Pure Compact Nucleic Acid Isolation Kit I—Large Volume). Initial
      diagnosis used an orthopox generic PCR plus a specific MPX PCR; follow-up samples
      tested with the specific MPX PCR assay. This analyte corresponds to skin lesion
      swab specimens.
    specimen: skin_lesion
    biomarker: mpox
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
  ct_rectal_swab:
    description: Monkeypox virus DNA detection by specific real-time PCR (qPCR) reported
      as quantification cycle (Cq/Ct). Samples were inactivated 1:1 with cobas omni
      lysis reagent (Roche) and extracted on MagNA Pure Compact. Initial diagnosis
      used orthopox generic PCR plus specific MPX PCR; follow-up used specific MPX
      PCR. This analyte corresponds to rectal swab specimens.
    specimen: rectal_swab
    biomarker: mpox
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
  ct_tongue_ulcer:
    description: Monkeypox virus DNA detection by specific real-time PCR (qPCR) reported
      as quantification cycle (Cq/Ct) from a tongue ulcer lesion swab (mucosal lesion).
      Samples were inactivated 1:1 with cobas omni lysis reagent (Roche) and extracted
      on MagNA Pure Compact. Initial diagnosis used orthopox generic PCR plus specific
      MPX PCR; follow-up used specific MPX PCR.
    specimen: mucosal_lesion_swab
    biomarker: mpox
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
  ct_oral_lesion:
    description: Monkeypox virus DNA detection by specific real-time PCR (qPCR) reported
      as quantification cycle (Cq/Ct) from an oral lesion swab (mucosal lesion). Samples
      were inactivated 1:1 with cobas omni lysis reagent (Roche) and extracted on
      MagNA Pure Compact. Initial diagnosis used orthopox generic PCR plus specific
      MPX PCR; follow-up used specific MPX PCR.
    specimen: mucosal_lesion_swab
    biomarker: mpox
