title: Monkeypox virus isolation from a semen sample collected in the early phase
  of infection in a patient with prolonged seminal viral shedding
doi: 10.1016/S1473-3099(22)00513-8
description: Case report from Rome, Italy (National Institute for Infectious Diseases
  ‘Lazzaro Spallanzani’) describing longitudinal mpox (monkeypox virus) DNA detection
  by real-time PCR in plasma, urine, semen, and rash/skin lesions from a single confirmed
  patient, with sampling days 5–19 after symptom onset. The report includes seminal
  shedding with Ct/Cq values and notes isolation of replication-competent virus from
  semen collected on day 6 after symptom onset using Vero E6 cells.
