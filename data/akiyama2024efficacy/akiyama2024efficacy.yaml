title: 'Efficacy and viral dynamics of tecovirimat in patients with MPOX: A multicenter
  open-label, double-arm trial in Japan'
doi: 10.1016/j.jiac.2023.11.025
description: Multicenter open-label trial in Japan (Tecopox study) enrolling patients
  with mpox between June 28, 2022 and April 30, 2023. Nineteen patients were allocated
  to oral tecovirimat (no control arm enrolled). Serial PCR Ct values were measured
  from blood, urine, oropharyngeal (throat) swabs, skin lesion specimens, and semen
  to evaluate viral dynamics and duration of viral detection over time after study
  inclusion/tecovirimat treatment. The CSV provided contains individual-level Ct (cycle
  threshold) measurements by patient and day (time) for multiple specimen types; most
  results are negative at many timepoints.
curation:
  method: ai_assisted
  data_source:
    - main_text
    - supplement
  extracted_on: '2026-09-17'
