title: Dose-dependent efficacy of intravenous brincidofovir across adenovirus species
  in immunocompromised patients
doi: 10.1016/j.jinf.2026.106835
description: Phase 2a ATHENA trial in immunocompromised patients with invasive human
  adenovirus (HAdV) infection treated with intravenous brincidofovir (BCV) in four
  dosing cohorts. The study monitored adenovirus in blood (serum/plasma) and stool
  using species-specific qPCR (screening and typing) and next-generation sequencing
  (NGS) for genotype identification, assessing virological responses and documenting
  species/genotype diversity including mixed infections. Patients in cohort 1 treated 
  with intravenous BCV at a dose of 0.2 mg/kg twice weekly (BIW). Patients in cohorts 
  2 treated with 0.3 mg/kg BIW. Patients in cohort 3 treated  with 0.4 mg/kg BIW. 
  The only patient where a serum sample was available treated with 0.4 mg/kg once weekly.
