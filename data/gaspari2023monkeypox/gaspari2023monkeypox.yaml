title: 'Monkeypox Outbreak 2022: Clinical and Virological Features of 30 Patients
  at the Sexually Transmitted Diseases Centre of Sant'' Orsola Hospital, Bologna,
  Northeastern Italy'
doi: 10.1128/jcm.01365-22
description: Observational study of 30 laboratory-confirmed mpox (MPXV) patients seen
  at the Sexually Transmitted Diseases Centre of Sant' Orsola Hospital (University
  of Bologna) in Bologna, Italy (20 June to 10 August 2022). Multiple specimen types
  (skin lesion swab, rectal swab, oropharyngeal swab, plasma, urine) were tested for
  MPXV DNA by real-time PCR and reported here as Ct values (with some negatives) at
  specific days after symptom onset.
curation:
  method: ai_assisted
  data_source:
    - main_text
    - table
  extracted_on: '2026-09-17'
analytes:
  skin_lesion_swab:
    description: MPXV DNA detection by real-time PCR on skin lesion swab specimens;
      results reported as PCR cycle threshold (Ct).
    specimen: skin_lesion
    biomarker: mpox
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
  oropharyngeal_swab:
    description: MPXV DNA detection by real-time PCR on oropharyngeal swab specimens;
      results reported as PCR cycle threshold (Ct).
    specimen: oropharyngeal_swab
    biomarker: mpox
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
  plasma:
    description: MPXV DNA detection by real-time PCR on plasma specimens; results
      reported as PCR cycle threshold (Ct).
    specimen: plasma
    biomarker: mpox
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
  urine:
    description: MPXV DNA detection by real-time PCR on urine specimens; results reported
      as PCR cycle threshold (Ct).
    specimen: urine
    biomarker: mpox
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
  rectal_swab:
    description: MPXV DNA detection by real-time PCR on rectal swab specimens; results
      reported as PCR cycle threshold (Ct).
    specimen: rectal_swab
    biomarker: mpox
    limit_of_detection: unknown
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
