title: An oral norovirus vaccine generates mucosal immunity and reduces viral shedding
  in a phase 2 placebo-controlled challenge study
doi: 10.1126/scitranslmed.adh9906
description: Phase 2b randomized, placebo-controlled vaccination and human challenge
  study of an oral tablet norovirus vaccine (VXA-G1.1-NN) assessing immunogenicity
  and efficacy against norovirus GI.1 challenge, including quantification of viral
  shedding in stool and emesis over post-challenge days. This extraction includes
  individual participant stool and emesis shedding measurements from provided figure-derived
  CSV rows for placebo recipients.
analytes:
  emesis:
    description: Norovirus shedding measurement in emesis, from figure-derived CSV
      data (quantitative values and negatives). Assay/method details not provided
      in the supplied text/CSV excerpt.
    specimen: emesis
    biomarker: norovirus
    limit_of_detection: 30566
    limit_of_quantification: unknown
    unit: gc/mL
    reference_event: inoculation
