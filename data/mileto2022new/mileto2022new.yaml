title: 'New challenges in human monkeypox outside Africa: A review and case report
  from Italy'
doi: 10.1016/j.tmaid.2022.102386
description: Case report (with review) describing an Italian adult male diagnosed
  with mpox (monkeypox virus, MPXV) in Milan, Italy (May 2022). Serial sampling from
  multiple body sites was tested by real-time PCR (Ct values reported) and viral isolation
  in Vero E6 cells; Table 1/figure CSV provide Ct time series by days from symptom
  onset for several specimen types (oropharyngeal swab, ulcerated perianal lesion,
  rectal/anal swab, foot lesion, plasma, seminal fluid, urine).
analytes:
  ct_oropharyngeal_swab:
    description: MPXV DNA detection by real-time PCR reported as cycle threshold (Ct)
      on oropharyngeal swab; Orthopoxvirus screening PCR (RealStar Orthopoxvirus PCR
      Kit 1.0, altona DIAGNOSTICS, targeting variola virus and non-variola Orthopoxvirus
      species) with MPXV confirmation by a specific homemade real-time PCR on screening-positive
      samples. Ct=40 used as PCR negative cut-off.
    specimen: oropharyngeal_swab
    biomarker: mpox
    limit_of_detection: 40
    limit_of_quantification: unknown
    unit: cycle threshold
    reference_event: symptom onset
  ct_ulcerated_perianal_lesion:
    description: MPXV DNA detection by real-time PCR reported as Ct on ulcerated perianal
      lesion swab; Orthopoxvirus screening PCR (RealStar Orthopoxvirus PCR Kit 1.0,
      altona DIAGNOSTICS) with MPXV confirmation by homemade real-time PCR on screening-positive
      samples. Ct=40 used as PCR negative cut-off.
    specimen: genital_or_rectal_lesion
    biomarker: mpox
