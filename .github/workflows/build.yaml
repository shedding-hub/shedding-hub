name: Shedding Hub

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint code
        run: black --check .
      # How much parallelism the runner actually has, printed because the first
      # attempt at this tuned against a 32-core laptop and mispredicted the
      # runner badly. Read it before changing -n below.
      - name: Report available parallelism
        run: |
          echo "nproc:            $(nproc)"
          python -c "import os; print('os.cpu_count():  ', os.cpu_count())"
          python -c "import os; print('sched_getaffinity:', len(os.sched_getaffinity(0)))"
      # -n 2 rather than -n auto. The fitting tests are independent and split
      # well, but `auto` reads os.cpu_count(), which on a throttled runner
      # reports more than is usable -- it made the 3.10 job *slower* (7m33s to
      # 9m23s). Two workers is the conservative floor; raise it once the step
      # above says the cores are really there.
      #
      # The thread pins stop the other half of the same mistake: scipy's BLAS
      # spawns a thread pool per process, so N workers each spawning N threads
      # thrash a small runner. Pinned, -n 2 goes 149s to 132s locally.
      - name: Run tests
        run: pytest -v -n 2 --cov=shedding_hub --cov-report=term-missing
        env:
          # test_load resolves a pull request through api.github.com, which
          # allows 60 requests an hour unauthenticated and has twice failed a
          # run with "403 rate limit exceeded". Actions supplies this token to
          # every workflow -- nothing has to be created for it -- and it raises
          # the ceiling to 5,000.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Every dataset's doi is resolved against its publisher, one request
          # each. Three jobs run tests/test_data.py, so a pull request made
          # that round trip three times over -- some 280 external requests for
          # a guarantee that only means anything once, and a documented source
          # of dropped connections. data-validation is the job that keeps it;
          # this one and minimum-python skip it.
          SHEDDING_HUB_SKIP_LINK_CHECKS: "1"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
      - name: Run README doctests
        run: python -m doctest -o ELLIPSIS -o NORMALIZE_WHITESPACE README.md
      - name: Build package
        run: python -m build
      - name: Validate package
        run: twine check dist/*.tar.gz dist/*.whl
      # twine check validates metadata, not contents. Auto-discovery used to
      # sweep `tests` and `scripts` into the wheel as top-level packages, so an
      # install claimed those names in site-packages; every wheel up to 0.1.3
      # carries them. This fails the build if that returns.
      - name: Assert the wheel ships only the package
        run: |
          python - <<'PY'
          import glob, zipfile
          zf = zipfile.ZipFile(glob.glob("dist/*.whl")[0])
          names = zf.namelist()
          tops = {n.split("/")[0] for n in names}
          allowed = {"shedding_hub"} | {t for t in tops if t.endswith(".dist-info")}
          assert tops <= allowed, f"wheel ships unexpected top-level entries: {sorted(tops - allowed)}"
          assert "shedding_hub/data/shedding_catalog.yaml" in names, (
              "the shipped catalog is missing from the wheel; load_shedding_catalog() "
              "would fail for every pip user"
          )
          meta = zf.read(next(n for n in names if n.endswith(".dist-info/METADATA"))).decode()
          assert "Requires-Python:" in meta, (
              "the wheel declares no Requires-Python, so pip installs it on interpreters "
              "too old to import it -- which is how 0.2.1 reached Python 3.9 users"
          )
          print("wheel contents OK:", sorted(tops))
          PY
      - name: Build the documentation
        run: |
          python scripts/build_doc_figures.py
          python -m mkdocs build --strict
  # Every other job runs 3.11, so "works on the oldest Python we claim to
  # support" was never a tested claim -- 0.2.1 shipped `int | None` annotations
  # that cannot be imported below 3.10 and nothing noticed. This job is the
  # claim's only enforcement; keep its python-version equal to the lower bound
  # of requires-python in pyproject.toml.
  minimum-python:
    name: Minimum supported Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      # Deliberately not requirements.txt: those pins (numpy 2.3.5, scipy
      # 1.16.3) themselves need 3.11+, so they cannot be installed here at all.
      # Installing the project resolves the dependency versions a real 3.10
      # user gets, which is the combination actually worth testing.
      - name: Install the package as a user would
        run: pip install . pytest pytest-xdist jsonschema
      # Deliberately still the whole suite. This job's worth is that it runs
      # everything on the oldest interpreter we claim to support, so trimming
      # it to a smoke test would hand back the time and take the guarantee
      # with it. Parallelism buys the time instead -- see the note on -n in the
      # build job; this is the job `auto` actually slowed down.
      - name: Run tests
        run: pytest -q -n 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHEDDING_HUB_SKIP_LINK_CHECKS: "1"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
  data-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      # - name: Create backup of current data
      #   run: make backup_data
      # - name: Run extraction notebooks
      #   run: make extraction
      # - name: Check nothing changed
      #   run: make assert_data_unchanged
      - name: Run just the data tests
        run: pytest tests/test_data.py -k test_data_validity
