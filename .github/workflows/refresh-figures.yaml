name: Refresh Dataset Figures

# The website draws its dataset pages from figures/, which is committed here
# because the site has no Python to regenerate them with. That makes them go
# stale when a dataset lands, and a stale figure is worse than a missing one: it
# shows a curve fitted to data that has since changed.
#
# Two things this workflow learned the hard way, on its first run:
#
# It opens a pull request rather than pushing. main requires review and passing
# checks, with enforce_admins on, so GITHUB_TOKEN cannot push to it -- the first
# version tried and was rejected with GH006.
#
# It triggers on data/** alone. Fits are not bit-reproducible across platforms
# (tests/test_parameter_export.py carries DRIFT_RTOL for the same reason), so a
# Linux runner re-rendering figures generated elsewhere always finds
# differences: the first run rewrote 286 files and found four analytes whose
# optimisation converged here but had not locally. Every code change would
# otherwise raise a pull request full of visually identical binaries. Refresh
# after a code change by hand with workflow_dispatch, once, rather than on each
# commit.

on:
  push:
    branches:
      - main
    paths:
      - "data/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Rebuild and open a PR
    runs-on: ubuntu-latest
    # Roughly 45 minutes: two catalog builds plus 282 renders. Bounded well
    # under the default ceiling so a hung fit cannot burn a day.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # The growth curve is read out of the commit log, and the default
          # fetch-depth of 1 would leave it a single point rather than an
          # error. build_curation_growth.py refuses a shallow clone, so this
          # failing is loud, but it should not fail at all.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Rebuild the gate-2 catalogs
        run: |
          make catalog_gate2
          make catalog_ct_gate2
      - name: Render the figures
        run: make figures
      - name: Rebuild the curation growth curve
        run: make curation_growth
      - name: Open a pull request if anything changed
        uses: peter-evans/create-pull-request@v7
        with:
          # GITHUB_TOKEN cannot open the pull request: this repository has
          # "Allow GitHub Actions to create and approve pull requests" turned
          # off, and a workflow-level permissions block cannot override that --
          # the first run pushed its branch and then failed on the API call.
          # The same personal access token the dispatch workflows already use
          # opens it as a person instead.
          #
          # It also means the pull request runs CI. A pull request opened with
          # GITHUB_TOKEN deliberately does not trigger workflows, so the figures
          # would otherwise arrive unchecked.
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          # The Ct gate-2 catalog rides along with the figures: it is built in
          # the same step and carries the parameters behind the Ct curves, which
          # the website lists beside them. The concentration gate-2 catalog stays
          # unpublished -- the package already ships its equivalent.
          add-paths: |
            figures
            shedding_catalog_ct_gate2.yaml
            curation_growth.yaml
          branch: figures/refresh
          # Reused rather than accumulating one branch per run: successive
          # refreshes supersede each other, and only the latest is wanted.
          delete-branch: true
          title: "figures: refresh the dataset pages"
          commit-message: |
            figures: refresh dataset pages after a data change

            Generated by .github/workflows/refresh-figures.yaml.
          body: |
            Regenerated `figures/` from the current `data/` and a fresh pair of
            gate-2 catalogs, and republished `shedding_catalog_ct_gate2.yaml`,
            which carries the parameters behind the cycle-threshold curves.

            Expect most of the 282 files to differ even when nothing meaningful
            has: fits are not bit-reproducible across platforms, so a Linux
            runner reproduces them only to within `DRIFT_RTOL`. What is worth
            reading in the diff is **added or removed** figures — those are
            analytes that gained or lost a converged fit.
