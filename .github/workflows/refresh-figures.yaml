name: Refresh Dataset Figures

# The website draws its dataset pages from figures/, which is committed here
# because the site has no Python to regenerate them with. That makes them go
# stale the moment a dataset lands, and a stale figure is worse than a missing
# one: it shows a curve fitted to data that has since changed.
#
# Refitting is slow -- the gate-2 catalogs are a full pass over every analyte --
# so this runs after a merge to main rather than on pull requests.

on:
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "shedding_hub/**"
      - "scripts/build_dataset_figures.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Rebuild and commit
    runs-on: ubuntu-latest
    # Roughly 45 minutes: two catalog builds plus 282 renders. Well inside the
    # default 6-hour ceiling, but bounded so a hung fit cannot burn a day.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Rebuild the gate-2 catalogs
        run: |
          make catalog_gate2
          make catalog_ct_gate2
      - name: Render the figures
        run: make figures
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures
          if git diff --cached --quiet; then
            echo "figures are already current"
            exit 0
          fi
          git commit -m "figures: refresh dataset pages after a data change

          Generated by .github/workflows/refresh-figures.yaml."
          # Rebase rather than force: another merge may have landed while the
          # catalogs were fitting, and this job owns only figures/.
          git pull --rebase origin main
          git push
