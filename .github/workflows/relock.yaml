name: Relock Dependencies

# requirements.txt is pip-compiled from requirements.in, and Dependabot's
# security fixes arrive one package at a time. With `main` requiring branches to
# be current before merging, clearing a backlog that way costs a full CI run per
# package plus a branch update for every PR still queued behind it -- 75 alerts
# across eleven packages meant roughly eleven serial cycles. Recompiling moves
# every pin in one commit and one CI run instead.
#
# Manual on purpose. A wholesale upgrade touches pins no alert asked about, so
# it wants a person deciding when, and the full suite plus `black --check`
# deciding whether. That is not theoretical: a Black bump changed two files'
# formatting and broke the build the day this was written.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  relock:
    name: Recompile and open a PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        # The version that INSTALLS the lockfile, not the one that last
        # compiled it. pip-compile resolves for the interpreter it runs on, so
        # compiling on 3.13 picked scipy 1.18, which requires >=3.12, and the
        # Build job -- running 3.11 -- then could not install the file at all.
        # The committed lockfile carries a "compiled with Python 3.13" header
        # for the same reason and had only been getting away with it.
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-tools
        # The version the lockfile itself pins, so the tool cannot drift from
        # the file it maintains.
        run: pip install pip-tools==7.6.1
      - name: Recompile
        run: pip-compile --upgrade
      - name: Open a pull request if anything changed
        uses: peter-evans/create-pull-request@v7
        with:
          # GITHUB_TOKEN cannot open pull requests here -- "Allow GitHub Actions
          # to create and approve pull requests" is off -- and a PR it did open
          # would not run CI, which is the entire point of this one.
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          add-paths: requirements.txt
          branch: chore/relock
          delete-branch: true
          title: "chore(deps): recompile requirements.txt"
          commit-message: |
            chore(deps): recompile requirements.txt

            Generated by .github/workflows/relock.yaml.
          body: |
            `pip-compile --upgrade` against the current `requirements.in`,
            run on Python 3.13 to match the lockfile's own header.

            This moves **every** pin, not only the ones with advisories, so read
            the diff for upgrades that could change behaviour rather than only
            for the security fixes. The full suite and `black --check` are the
            check that matters — a linter bump has broken this build before.

            Supersedes any single-package Dependabot pull requests still open
            against `requirements.txt`; close them if this lands first.
